<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="cli23a-title cli23a-desc"><title id="cli23a-title">CLI 程序与原库是两层：点命令止步于 CLI</title><desc id="cli23a-desc">用户输入先进入 sqlite3 CLI 程序。以点开头的命令由 CLI 自己解析和格式化，只有 SQL 才通过 sqlite3_prepare/sqlite3_step 交给 SQLite 库。</desc><defs><marker id="ar23a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">“SQLite”与“sqlite3 CLI”不是同一个东西</text><rect x="26" y="86" width="150" height="88" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="101" y="124" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#147f80">终端输入</text><text x="101" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#2c5054">.mode box / SQL</text><path d="M176 130 L226 130" stroke="#79939b" stroke-width="2.4" fill="none" marker-end="url(#ar23a)"/><rect x="230" y="70" width="330" height="240" rx="14" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="395" y="100" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#4b3a6b">CLI 程序（sqlite3）</text><rect x="250" y="118" width="290" height="60" rx="10" fill="#fff" stroke="#8662a9" stroke-width="1.4"/><text x="266" y="142" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#4b3a6b">点命令解析（以 “.” 开头）</text><text x="266" y="164" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#537178">.tables / .schema / .indexes / .dump</text><rect x="250" y="192" width="290" height="60" rx="10" fill="#fff" stroke="#8662a9" stroke-width="1.4"/><text x="266" y="216" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#4b3a6b">输出格式化（.mode / QRF）</text><text x="266" y="238" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#537178">box / csv / quote / json …</text><text x="395" y="286" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" fill="#6b4a86">点命令在此闭环，不外发</text><path d="M560 190 L636 190" stroke="#79939b" stroke-width="2.4" fill="none" marker-end="url(#ar23a)"/><text x="598" y="178" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#537178">仅 SQL</text><rect x="640" y="70" width="294" height="240" rx="14" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="787" y="100" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#147f80">SQLite 库</text><text x="660" y="136" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#2c5054">sqlite3_prepare() 编译语句</text><text x="660" y="166" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#2c5054">sqlite3_step() 逐行求值</text><text x="660" y="196" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#2c5054">VDBE / B-Tree / Pager</text><text x="660" y="248" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#537178">点命令不能作为 sqlite3_prepare()</text><text x="660" y="270" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#537178">或 sqlite3_exec() 的参数</text><text x="26" y="356" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" fill="#537178">区分二者很重要：驱动与绑定面向的是库；点命令是 CLI 面向“人”的语法。</text><text x="26" y="382" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">本章内容来自 SQLite 官方 CLI 文档（cli.html）。</text></svg>
