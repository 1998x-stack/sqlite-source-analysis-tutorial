<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="t-04ast d-04ast"><title id="t-04ast">SELECT 查询表达式树示意</title><desc id="d-04ast">SELECT name FROM users WHERE id = ? 中的 WHERE 条件可以表示成 EQ 节点，左右分别为列 id 与参数占位符。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#789395"/></marker></defs><rect width="920" height="390" fill="#f9fbf9"/><text x="30" y="42" text-anchor="start" fill="#23494d" font-size="20" font-weight="800" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">WHERE id = ? 作为语法树会长什么样？</text><rect x="350" y="72" width="220" height="70" rx="14" fill="#e7edef" stroke="#315c69" stroke-width="1.6"/><text x="460" y="103" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Select</text><text x="460" y="130" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">投影 name / 表 users</text><path d="M460 143L460 202" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="350" y="207" width="220" height="70" rx="14" fill="#fff0e6" stroke="#c66b48" stroke-width="1.6"/><text x="460" y="238" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">WHERE: Expr</text><text x="460" y="265" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">TK_EQ</text><path d="M394 279L220 316" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M525 279L699 316" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="100" y="310" width="235" height="67" rx="14" fill="#e3f2ec" stroke="#18847d" stroke-width="1.6"/><text x="217.5" y="341" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">左子树：列引用</text><text x="217.5" y="368" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">id</text><rect x="590" y="310" width="235" height="67" rx="14" fill="#ece9f7" stroke="#7763b5" stroke-width="1.6"/><text x="707.5" y="341" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">右子树：绑定参数</text><text x="707.5" y="368" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">? / 运行期值</text></svg>
