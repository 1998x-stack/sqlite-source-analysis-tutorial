<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="th24b-title th24b-desc"><title id="th24b-title">语句覆盖、分支覆盖与 MC/DC 的差别</title><desc id="th24b-desc">语句覆盖要求每行执行一次；分支覆盖要求每个分支方向都走到；MC/DC 还要求每个条件被证明能独立影响判定结果。错误处理分支必须真实执行。</desc><defs><marker id="ar24b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">“覆盖率”有不同口径，100% 指的是哪一种</text><rect x="26" y="74" width="420" height="120" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="1.8"/><text x="46" y="106" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" fill="#24464b">if ( a&gt;0 &amp;&amp; b&gt;0 ) { /* P */ } else { /* Q */ }</text><text x="46" y="140" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#2c5054">语句覆盖：P、Q 各至少执行一次</text><text x="46" y="166" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#2c5054">分支覆盖：判定为真、为假两个方向都走到</text><rect x="26" y="214" width="420" height="150" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="1.8"/><text x="46" y="246" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="700" fill="#4b3a6b">MC/DC 额外要求</text><text x="46" y="276" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#4b3a6b">每个条件都取到所有结果</text><text x="46" y="302" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#4b3a6b">每个条件都被证明能独立改变判定</text><text x="46" y="328" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#6b4a86">C 的 &amp;&amp;/|| 是短路运算符，故两者很接近</text><text x="46" y="352" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#6b4a86">差异主要在布尔向量测试；SQLite 用 testcase() 宏补齐</text><rect x="500" y="74" width="434" height="290" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="1.8"/><text x="522" y="106" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="16" font-weight="700" fill="#8a4326">为什么错误处理分支必须真被跑过</text><rect x="522" y="126" width="392" height="58" rx="9" fill="#fff" stroke="#d9a186" stroke-width="1.2"/><text x="538" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#8a4326">if ( malloc 返回 NULL ) return SQLITE_NOMEM;</text><text x="538" y="172" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#537178">正常路径永远走不到，但必须验证</text><rect x="522" y="196" width="392" height="58" rx="9" fill="#fff" stroke="#d9a186" stroke-width="1.2"/><text x="538" y="220" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#8a4326">I/O / 崩溃 / 组合失败等异常场景</text><text x="538" y="242" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#537178">由异常测试与故障注入专门覆盖</text><path d="M446 200 L496 200" stroke="#79939b" stroke-width="2.2" fill="none" marker-end="url(#ar24b)"/><text x="522" y="286" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#8a4326">官方结论：维护 100% MC/DC 很费力，</text><text x="522" y="310" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#8a4326">对大多数应用未必划算；</text><text x="522" y="334" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#8a4326">但对广泛部署的基础库很有价值。</text></svg>
