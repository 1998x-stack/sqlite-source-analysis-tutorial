<svg xmlns="http://www.w3.org/2000/svg" width="920" height="310" viewBox="0 0 920 310" role="img" aria-labelledby="t-01s d-01s"><title id="t-01s">三种 SQLite 源码分发形式</title><desc id="d-01s">Fossil canonical source 是上游真实源码；GitHub SQLite 镜像是协作阅读入口；amalgamation 是经生成流程产出的单文件 sqlite3.c。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#789395"/></marker></defs><rect width="920" height="310" fill="#f9fbf9"/><text x="34" y="37" text-anchor="start" fill="#23494d" font-size="20" font-weight="800" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">同一 SQLite：三种不同“源码入口”</text><rect x="30" y="85" width="245" height="90" rx="14" fill="#e3f2ec" stroke="#18847d" stroke-width="1.6"/><text x="152.5" y="116" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Fossil canonical</text><text x="152.5" y="143" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">sqlite.org/src</text><rect x="338" y="85" width="245" height="90" rx="14" fill="#e7edef" stroke="#315c69" stroke-width="1.6"/><text x="460.5" y="116" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">GitHub mirror</text><text x="460.5" y="143" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">github.com/sqlite/sqlite</text><rect x="645" y="85" width="245" height="90" rx="14" fill="#fff0e6" stroke="#c66b48" stroke-width="1.6"/><text x="767.5" y="116" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Amalgamation</text><text x="767.5" y="143" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">sqlite3.c + sqlite3.h</text><path d="M275 130L335 130" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><text x="306" y="112" text-anchor="middle" fill="#243f43" font-size="13" font-weight="550" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">镜像</text><path d="M152 176L152 240" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M152 240L750 240" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M750 240L750 178" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><text x="449" y="227" text-anchor="middle" fill="#243f43" font-size="15" font-weight="700" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">构建工具 / 代码生成脚本 → 合并版</text><text x="460" y="283" text-anchor="middle" fill="#243f43" font-size="15" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">读实现与提交历史：canonical source　|　嵌入项目编译：amalgamation</text></svg>
