<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="10a-title 10a-desc" viewBox="0 0 960 445" width="960" height="445"><title id="10a-title">从 SQL 表达式树到虚拟机寄存器指令的变化</title><desc id="10a-desc">1 + 2*3 被组织成加法根、乘法子表达式，再由代码生成器产生计算寄存器的 VDBE 程序；实际 opcode 顺序由版本优化决定。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="445" fill="#f9fbf9"/><text x="27" y="40" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="21" font-weight="720">从 AST 到寄存器：编译器必须分配中间值</text><rect x="29" y="101" width="269" height="96" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="163.5" y="131" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">Expr：1 + (2 * 3)</text><text x="163.5" y="158" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">运算符树 / 叶节点</text><rect x="354" y="101" width="269" height="96" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="488.5" y="131" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">expr.c</text><text x="488.5" y="158" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">sqlite3ExprCode*</text><rect x="680" y="101" width="250" height="96" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="805" y="131" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">VDBE 程序</text><text x="805" y="158" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">寄存器 / 指令 / 跳转</text><path d="M298 148L351 148" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M623 148L677 148" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="58" y="273" width="382" height="85" rx="12" fill="#fff6df" stroke="#ab7b2c" stroke-width="1.6"/><text x="249" y="303" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">编译期：语义 &amp; 常量计算</text><text x="249" y="330" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">可能被折叠 / 重排</text><rect x="525" y="273" width="382" height="85" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="716" y="303" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">执行期：读寄存器并计算</text><text x="716" y="330" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">结果暴露给 sqlite3_step()</text><path d="M482 198L249 271" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M806 200L731 270" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><text x="28" y="411" text-anchor="start" fill="#527277" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">示意不保证出现 Multiply / Add 两个 opcode：常量表达式可被优化，查看本机 EXPLAIN 结果。</text></svg>
