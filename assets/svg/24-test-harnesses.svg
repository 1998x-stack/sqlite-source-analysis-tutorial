<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">SQLite 的四类独立测试框架</title><desc id="desc">TCL tests、TH3、SQL Logic Test 和 dbsqlfuzz 是四套独立维护的测试体系，目标和可获得性不同。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#c76743"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.label{font-size:18px;font-weight:700}.head{font-size:23px;font-weight:700}.box{fill:#fffdf9;stroke:#b9c9c5;stroke-width:2}.teal{fill:#e4f3ef;stroke:#147f80;stroke-width:2}.terra{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#f0edfb;stroke:#7461ba;stroke-width:2}.gold{fill:#fff6df;stroke:#b28a2e;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arr)}.line2{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arr2)}.dash{stroke:#916c22;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<rect x="50" y="90" width="410" height="150" rx="15" class="teal"/><text x="74" y="132" class="head">TCL Tests</text><text x="74" y="172" class="label" style="font-size:17px">公开源码 · 主开发测试</text><text x="74" y="206" class="small">SQL 回归、边界、异常</text><rect x="500" y="90" width="410" height="150" rx="15" class="terra"/><text x="524" y="132" class="head">TH3</text><text x="524" y="172" class="label" style="font-size:17px">专有 C 测试</text><text x="524" y="206" class="small">嵌入式平台 · 覆盖分析</text><rect x="50" y="292" width="410" height="150" rx="15" class="violet"/><text x="74" y="334" class="head">SQL Logic Test</text><text x="74" y="374" class="label" style="font-size:17px">跨数据库比对</text><text x="74" y="408" class="small">同一 SQL 结果一致性</text><rect x="500" y="292" width="410" height="150" rx="15" class="gold"/><text x="524" y="334" class="head">dbsqlfuzz</text><text x="524" y="374" class="label" style="font-size:17px">专有 fuzz engine</text><text x="524" y="408" class="small">同时变异数据库与 SQL</text>
<text x="52" y="486" class="small">四种工具不能互相替代；TH3 与 dbsqlfuzz 并非公开仓库中可直接 make 的免费测试目标。</text></svg>