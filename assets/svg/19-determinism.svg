<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="func19c-title func19c-desc"><title id="func19c-title">SQLITE_DETERMINISTIC 的语义与索引使用边界</title><desc id="func19c-desc">deterministic 声明是承诺相同输入得到相同输出，可能允许用于表达式索引等 schema 语境；错误标记含时间随机数或外部状态的函数可损坏索引语义。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="430" fill="#fbfcfa"/><text x="27" y="42" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">DETERMINISTIC 不是让 SQLite“自动缓存一切函数结果”</text><rect x="33" y="105" width="417" height="93" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="241.5" y="134" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">pure(input) → same output</text><text x="241.5" y="161" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">可合法声明 DETERMINISTIC</text><rect x="516" y="105" width="414" height="93" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="723" y="134" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">time() / random() / external state</text><text x="723" y="161" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">不得错误标记为确定性</text><rect x="113" y="281" width="306" height="83" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="2"/><text x="266" y="310" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">表达式索引/生成列等</text><text x="266" y="337" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">要求可确定的语义</text><rect x="564" y="281" width="306" height="83" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="717" y="310" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">错误标记的风险</text><text x="717" y="337" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">索引与实际值不一致</text><path d="M240 199 L262 278" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M740 199 L716 278" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><text x="28" y="405" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#55747b">声明标志不是性能强制指令；禁止“只要 deterministic 就保证函数只执行一次”的写法。</text></svg>
