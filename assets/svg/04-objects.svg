<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t-04o d-04o"><title id="t-04o">SQLite 编译期与运行期的对象图</title><desc id="d-04o">sqlite3 连接持有连接级状态；Parse 是语句编译上下文；Expr/Select 是语法结构；Vdbe 是执行程序；Table/Index 来自 schema 元数据。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#789395"/></marker></defs><rect width="960" height="440" fill="#f9fbf9"/><text x="34" y="42" text-anchor="start" fill="#23494d" font-size="20" font-weight="800" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">别把“数据库连接”与“某条 SQL 的中间表示”混成一类</text><rect x="365" y="78" width="220" height="75" rx="14" fill="#e7edef" stroke="#315c69" stroke-width="1.6"/><text x="475" y="109" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">sqlite3</text><text x="475" y="136" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">连接级状态</text><rect x="64" y="220" width="215" height="90" rx="14" fill="#e3f2ec" stroke="#18847d" stroke-width="1.6"/><text x="171.5" y="251" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Schema</text><text x="171.5" y="278" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Table / Index</text><rect x="366" y="220" width="215" height="90" rx="14" fill="#fff0e6" stroke="#c66b48" stroke-width="1.6"/><text x="473.5" y="251" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Parse</text><text x="473.5" y="278" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">当前编译上下文</text><rect x="680" y="220" width="215" height="90" rx="14" fill="#ece9f7" stroke="#7763b5" stroke-width="1.6"/><text x="787.5" y="251" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Vdbe</text><text x="787.5" y="278" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">执行器 / 指令程序</text><path d="M395 154L173 218" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M475 155L475 218" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M560 154L784 218" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M580 265L677 265" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="230" y="355" width="190" height="62" rx="14" fill="#fff4d9" stroke="#ab7b25" stroke-width="1.6"/><text x="325" y="386" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Expr / Select</text><text x="325" y="413" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">语法结构</text><path d="M443 310L357 353" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><text x="35" y="431" text-anchor="start" fill="#546f74" font-size="14" font-weight="400" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">示意持有或构造关系；结构体具体字段随 SQLite 版本与编译选项变化</text></svg>
