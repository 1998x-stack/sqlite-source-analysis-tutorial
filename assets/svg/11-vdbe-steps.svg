<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v11a-title v11a-desc" viewBox="0 0 960 425" width="960" height="425"><title id="v11a-title">VDBE 预处理程序逐步执行时序</title><desc id="v11a-desc">prepare 编译字节码，step 从当前指令位置运行，可能返回多次 SQLITE_ROW，最后 SQLITE_DONE；finalize 释放语句。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="425" fill="#fbfcfa"/><text x="27" y="42" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">prepare 编译程序，step 推进执行，不是每次重新解析 SQL</text><rect x="25" y="99" width="197" height="91" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="123.5" y="129" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">prepare_v2()</text><text x="123.5" y="157" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">构造 sqlite3_stmt</text><rect x="266" y="99" width="197" height="91" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="364.5" y="129" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">step() → ROW</text><text x="364.5" y="157" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">停止并暴露一行</text><rect x="508" y="99" width="197" height="91" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="606.5" y="129" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">step() → ROW</text><text x="606.5" y="157" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">继续并暴露下一行</text><rect x="750" y="99" width="185" height="91" rx="12" fill="#edf6df" stroke="#6c8c32" stroke-width="1.6"/><text x="842.5" y="129" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">step() → DONE</text><text x="842.5" y="157" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">语句执行结束</text><path d="M222 145L263 145" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M463 145L505 145" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M705 145L747 145" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><rect x="275" y="269" width="411" height="87" rx="12" fill="#eee9f9" stroke="#705fb5" stroke-width="1.6"/><text x="480.5" y="299" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">VDBE 指令指针 + 寄存器 + 游标</text><text x="480.5" y="327" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">一次 prepared statement 的执行态</text><path d="M380 192L405 266" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M596 192L581 266" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><text x="28" y="394" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#537177" font-weight="470" text-anchor="start">边界：具体 opcode、地址、程序计数器如何保存，依 SQLite 源码版本而变化。</text></svg>
