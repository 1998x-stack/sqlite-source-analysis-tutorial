<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07c-title 07c-desc" viewBox="0 0 960 394" width="960" height="394"><title id="07c-title">如何按问题挑选 SQLite 调试工具</title><desc id="07c-desc">查询结果错误先写最小复现实验，访问路径疑问先 EQP，opcode 生成问题使用 debug 构建和加指令追踪。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="394" fill="#f9fbf9"/><text x="30" y="42" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="21" font-weight="720">先选问题，再选工具，而不是到处打开日志</text><rect x="45" y="93" width="250" height="90" rx="12" fill="#eaf5e8" stroke="#3c8466" stroke-width="1.6"/><text x="170" y="123" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">为什么结果不对？</text><text x="170" y="150" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">最小 SQL + 结果断言</text><rect x="355" y="93" width="250" height="90" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="480" y="123" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">为什么使用该索引？</text><text x="480" y="150" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">EXPLAIN QUERY PLAN</text><rect x="665" y="93" width="250" height="90" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="790" y="123" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">指令由谁生成？</text><text x="790" y="150" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">DEBUG / addoptrace</text><path d="M170 186L170 251" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M480 186L480 251" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M790 186L790 251" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="50" y="266" width="240" height="31" rx="15" fill="#e9f0f3"/><text x="170" y="287" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">参数化 / 控制变量</text><rect x="362" y="266" width="240" height="31" rx="15" fill="#fff6df"/><text x="482" y="287" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">ANALYZE / 统计信息</text><rect x="675" y="266" width="240" height="31" rx="15" fill="#fff0e8"/><text x="795" y="287" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">断点与调用栈</text><text x="30" y="360" text-anchor="start" fill="#567276" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">一次调试记录应包含库版本、源码检出、编译宏、SQL、输出和未复现的情况。</text></svg>
