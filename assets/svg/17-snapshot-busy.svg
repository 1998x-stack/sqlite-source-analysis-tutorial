<svg xmlns="http://www.w3.org/2000/svg" width="960" height="446" viewBox="0 0 960 446" role="img" aria-labelledby="lock17b-title lock17b-desc"><title id="lock17b-title">WAL 快照过旧导致 BUSY_SNAPSHOT 的两连接时间线</title><desc id="lock17b-desc">读者 A 建立旧快照，写者 B 提交后，读者 A 企图升级为写事务会失败 SQLITE_BUSY_SNAPSHOT；A 回滚后重开写事务才可继续。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="446" fill="#fbfcfa"/><text x="27" y="39" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">一个旧快照不能直接变成最新写事务</text><rect x="29" y="93" width="284" height="98" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="171" y="122" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">连接 A · BEGIN; SELECT</text><text x="171" y="149" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">固定读快照 S0</text><rect x="339" y="93" width="284" height="98" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="481" y="122" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">连接 B · UPDATE; COMMIT</text><text x="481" y="149" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">最新快照 S1</text><rect x="649" y="93" width="284" height="98" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="791" y="122" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">A 尝试 UPDATE</text><text x="791" y="149" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">SQLITE_BUSY_SNAPSHOT</text><path d="M313 143 L336 143" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M623 143 L646 143" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect x="130" y="281" width="300" height="88" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="280" y="310" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">A 先 ROLLBACK</text><text x="280" y="337" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">旧快照关闭</text><rect x="536" y="281" width="300" height="88" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="2"/><text x="686" y="310" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">A 新 BEGIN IMMEDIATE</text><text x="686" y="337" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">建立新的写入起点</text><path d="M791 195 L685 278" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M430 324 L533 324" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><text x="28" y="415" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#527276">结果码与出现时机依连接模式而变；此演示明确采用 WAL 和两个独立连接。</text></svg>
