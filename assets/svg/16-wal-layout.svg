<svg xmlns="http://www.w3.org/2000/svg" width="960" height="396" viewBox="0 0 960 396" role="img" aria-labelledby="wal16a-title wal16a-desc"><title id="wal16a-title">WAL 文件格式与帧分布</title><desc id="wal16a-desc">WAL 文件包含 32 字节头与每个 frame 的 24 字节帧头和一个数据库页。帧头中的 commit 标记、校验和与盐值用于恢复和一致性。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="396" fill="#fbfcfa"/><text x="27" y="39" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">WAL 与主库文件的内容不是相同的时间线</text><rect x="26" y="87" width="203" height="102" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="127.5" y="116" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">WAL Header</text><text x="127.5" y="143" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">32 bytes · salt/checksum</text><rect x="271" y="87" width="203" height="102" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="372.5" y="116" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Frame 1</text><text x="372.5" y="143" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">24B header + page 2</text><rect x="516" y="87" width="203" height="102" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="617.5" y="116" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Frame 2</text><text x="617.5" y="143" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">24B header + page 3</text><rect x="761" y="87" width="173" height="102" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="847.5" y="116" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Frame 3</text><text x="847.5" y="143" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">commit frame</text><path d="M229 137 L268 137" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M474 137 L513 137" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M719 137 L757 137" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect x="72" y="272" width="373" height="35" rx="16" fill="#f8f3e4" stroke="#9b833c" stroke-width=".8"/><text x="258.5" y="296" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5054">frame header：page number / db size</text><rect x="513" y="272" width="392" height="35" rx="16" fill="#f4edf9" stroke="#8662a9" stroke-width=".8"/><text x="709" y="296" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5054">WAL-index：定位合适版本的 page</text><text x="30" y="364" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#537178">一条事务可能写多个帧；提交边界不能简单按文件长度判断。</text></svg>
