<svg xmlns="http://www.w3.org/2000/svg" width="960" height="431" viewBox="0 0 960 431" role="img" aria-labelledby="plan18c-title plan18c-desc"><title id="plan18c-title">复合索引的等值前缀与范围约束解释</title><desc id="plan18c-desc">INDEX(category,created_at) 常见支持 category 等值过滤并按 created_at 范围扫描；单纯 created_at 过滤是否有 skip-scan 则要结合 ANALYZE 统计。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="431" fill="#fbfcfa"/><text x="28" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">INDEX(category, created_at) 的顺序影响可用查找前缀</text><rect x="40" y="99" width="400" height="95" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="240" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">WHERE category = &apos;A&apos;</text><text x="240" y="155" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">索引前缀等值约束</text><rect x="522" y="99" width="399" height="95" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="721.5" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">AND created_at &amp;gt;= 100</text><text x="721.5" y="155" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">后续列范围约束</text><path d="M440 148 L518 148" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect x="170" y="274" width="623" height="89" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="2"/><text x="481.5" y="303" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">INDEX(category, created_at)</text><text x="481.5" y="330" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">定位 A 分段后做 created_at 范围扫描</text><path d="M720 199 L550 271" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><text x="29" y="403" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#51737a">skip-scan 依数据分布、统计信息和版本而定；EQP 只能描述实际选择的访问路径。</text></svg>
