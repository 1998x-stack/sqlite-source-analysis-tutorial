<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">SQLite 3.53.0 的六类变化</title><desc id="svg-desc">3.53.0 包含存储正确性、SQL 语言、查询规划、CLI/QRF、JSON/C API 与 WASM/浮点转换变化。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#147f80"/></marker><style>.bg{fill:#fffdf9}.teal{fill:#dff1eb;stroke:#147f80;stroke-width:2}.rust{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#eeeafd;stroke:#7161b5;stroke-width:2}.gold{fill:#fbf1d9;stroke:#a77b28;stroke-width:2}.head{font:700 29px system-ui,sans-serif;fill:#153438}.label{font:700 20px system-ui,sans-serif;fill:#203035}.small{font:16px system-ui,sans-serif;fill:#53676d}.tiny{font:14px system-ui,sans-serif;fill:#53676d}</style></defs><rect class="bg" width="1000" height="560" rx="22"/><text x="48" y="52" class="head">SQLite 3.53.0 的六类变化</text><rect x="45" y="92" width="290" height="165" rx="15" class="rust"/><text x="190" y="130" text-anchor="middle" class="label">存储正确性</text><text x="190" y="166" text-anchor="middle" class="small">WAL-reset corruption fix</text><text x="190" y="197" text-anchor="middle" class="small">Stale expression index</text>
<rect x="355" y="92" width="290" height="165" rx="15" class="teal"/><text x="500" y="130" text-anchor="middle" class="label">SQL 语言</text><text x="500" y="166" text-anchor="middle" class="small">ALTER / REINDEX EXPRESSIONS</text><text x="500" y="197" text-anchor="middle" class="small">TEMP trigger / VACUUM INTO</text>
<rect x="665" y="92" width="290" height="165" rx="15" class="violet"/><text x="810" y="130" text-anchor="middle" class="label">Query Planner</text><text x="810" y="166" text-anchor="middle" class="small">EXCEPT / INTERSECT / UNION sort-merge</text><text x="810" y="197" text-anchor="middle" class="small">Star-schema join-order improvements</text>
<rect x="45" y="290" width="290" height="165" rx="15" class="gold"/><text x="190" y="328" text-anchor="middle" class="label">CLI / QRF</text><text x="190" y="364" text-anchor="middle" class="small">Interactive Unicode box output</text><text x="190" y="395" text-anchor="middle" class="small">Batch mode keeps legacy output</text>
<rect x="355" y="290" width="290" height="165" rx="15" class="rust"/><text x="500" y="328" text-anchor="middle" class="label">JSON / C API</text><text x="500" y="364" text-anchor="middle" class="small">json_array_insert / jsonb_array_insert</text><text x="500" y="395" text-anchor="middle" class="small">sqlite3changegroup_change_*</text>
<rect x="665" y="290" width="290" height="165" rx="15" class="teal"/><text x="810" y="328" text-anchor="middle" class="label">WASM / 数值转换</text><text x="810" y="364" text-anchor="middle" class="small">opfs-wl + Web Locks</text><text x="810" y="395" text-anchor="middle" class="small">17 significant digits default</text>
<text x="500" y="510" text-anchor="middle" class="tiny">每项变化都限定在官方 release notes 所述范围，不推导通用性能保证。</text></svg>