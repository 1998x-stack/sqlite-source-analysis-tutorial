<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">SQLite 3.53.0 的发布变化地图</title><desc id="svg-desc">3.53.0 主要变化分为存储正确性、SQL 语言、CLI/QRF、WASM 与数值转换几个方面。</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#147f80"/></marker>
 <marker id="arrow-rust" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c76743"/></marker>
 <style>
 .bg{fill:#fffdf9}.teal{fill:#dff1eb;stroke:#147f80;stroke-width:2}.rust{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#eeeafd;stroke:#7161b5;stroke-width:2}.gold{fill:#fbf1d9;stroke:#a77b28;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arrow)}.line-r{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arrow-rust)}.dash{stroke:#8c9c98;stroke-width:2;stroke-dasharray:7 7;fill:none}.head{font:700 29px system-ui,sans-serif;fill:#153438}.label{font:700 21px system-ui,sans-serif;fill:#203035}.small{font:17px system-ui,sans-serif;fill:#53676d}.tiny{font:15px system-ui,sans-serif;fill:#53676d}
 </style>
</defs>
<rect class="bg" width="1000" height="560" rx="22"/>
<text x="48" y="52" class="head">SQLite 3.53.0 的发布变化地图</text>
<rect x="55" y="115" width="270" height="150" rx="16" class="rust"/><text x="190" y="155" text-anchor="middle" class="label">存储正确性</text><text x="190" y="190" text-anchor="middle" class="small">WAL-reset bug 修复</text><text x="190" y="220" text-anchor="middle" class="small">Stale expression index</text><rect x="365" y="115" width="270" height="150" rx="16" class="teal"/><text x="500" y="155" text-anchor="middle" class="label">SQL 语言</text><text x="500" y="190" text-anchor="middle" class="small">ALTER / REINDEX EXPRESSIONS</text><text x="500" y="220" text-anchor="middle" class="small">TEMP trigger / VACUUM INTO</text><rect x="675" y="115" width="270" height="150" rx="16" class="violet"/><text x="810" y="155" text-anchor="middle" class="label">CLI / QRF</text><text x="810" y="190" text-anchor="middle" class="small">终端结果格式化</text><text x="810" y="220" text-anchor="middle" class="small">交互与批处理区分</text><rect x="210" y="325" width="270" height="145" rx="16" class="gold"/><text x="345" y="365" text-anchor="middle" class="label">JSON / C API</text><text x="345" y="400" text-anchor="middle" class="small">json_array_insert</text><text x="345" y="430" text-anchor="middle" class="small">新接口与配置项</text><rect x="520" y="325" width="270" height="145" rx="16" class="teal"/><text x="655" y="365" text-anchor="middle" class="label">JavaScript / WASM</text><text x="655" y="400" text-anchor="middle" class="small">opfs-wl VFS</text><text x="655" y="430" text-anchor="middle" class="small">Web Locks + waitAsync</text><path d="M190 265 V292 H345 V317" class="dash"/><path d="M500 265 V317" class="dash"/><path d="M810 265 V292 H655 V317" class="dash"/><text x="500" y="520" text-anchor="middle" class="small">按功能层归类，不代表所有改动来自同一模块</text>
</svg>