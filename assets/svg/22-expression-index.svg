<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">表达式索引把表达式结果存成 B-tree key</title><desc id="desc">INSERT 或 UPDATE 时计算索引表达式并写入 B-tree；查询时相同表达式可映射到索引查找。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#c76743"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.label{font-size:18px;font-weight:700}.head{font-size:23px;font-weight:700}.box{fill:#fffdf9;stroke:#b9c9c5;stroke-width:2}.teal{fill:#e4f3ef;stroke:#147f80;stroke-width:2}.terra{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#f0edfb;stroke:#7461ba;stroke-width:2}.gold{fill:#fff6df;stroke:#b28a2e;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arr)}.line2{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arr2)}.dash{stroke:#916c22;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<rect x="36" y="118" width="190" height="112" rx="14" class="box"/><text x="131" y="158" text-anchor="middle" class="label">表行</text><text x="131" y="190" text-anchor="middle" class="small">account_id, amount</text>
<path d="M226 174 H300" class="line"/><rect x="304" y="118" width="220" height="112" rx="14" class="terra"/><text x="414" y="158" text-anchor="middle" class="label">表达式求值</text><text x="414" y="190" text-anchor="middle" class="small">abs(amount)</text>
<path d="M524 174 H598" class="line"/><rect x="602" y="118" width="310" height="112" rx="14" class="teal"/><text x="757" y="158" text-anchor="middle" class="label">Index B-tree</text><text x="757" y="190" text-anchor="middle" class="small">(account_id, abs(amount), rowid)</text>
<path d="M757 230 V310 H414 V356" class="line2"/>
<rect x="230" y="358" width="370" height="88" rx="14" class="violet"/><text x="415" y="394" text-anchor="middle" class="label">WHERE abs(amount) &gt; ?</text><text x="415" y="422" text-anchor="middle" class="small">匹配同一表达式，Planner 才能考虑索引</text>
<text x="630" y="376" class="small">索引不是查询时临时算出所有行</text><text x="630" y="404" class="small">它在写入路径维护键值</text></svg>