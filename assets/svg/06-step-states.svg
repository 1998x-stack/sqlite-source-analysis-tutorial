<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06b-title 06b-desc" viewBox="0 0 960 420" width="960" height="420"><title id="06b-title">sqlite3_step 的正常与错误返回分支</title><desc id="06b-desc">sqlite3_step 可能多次返回 SQLITE_ROW，最后为 SQLITE_DONE；遇到错误需读取 rc 并清理 stmt。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="420" fill="#f9fbf9"/><text x="32" y="40" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="21" font-weight="720">一条 prepared statement 如何结束？</text><rect x="36" y="100" width="235" height="80" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="153.5" y="130" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">sqlite3_step(stmt)</text><text x="153.5" y="157" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">驱动一段 VDBE 程序</text><rect x="353" y="78" width="240" height="86" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="473" y="108" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">SQLITE_ROW</text><text x="473" y="135" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">读列、继续 step</text><rect x="686" y="78" width="240" height="86" rx="12" fill="#eaf5e8" stroke="#3c8466" stroke-width="1.6"/><text x="806" y="108" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">SQLITE_DONE</text><text x="806" y="135" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">正常完成</text><rect x="353" y="261" width="240" height="86" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="473" y="291" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">SQLITE_* 错误</text><text x="473" y="318" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">读取扩展码和消息</text><rect x="686" y="261" width="240" height="86" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="806" y="291" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">sqlite3_finalize</text><text x="806" y="318" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">释放 stmt / 检查清理</text><path d="M271 129L350 120" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M593 120L683 120" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M470 167L270 201" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M270 201L152 181" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M200 181L200 178" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M270 169L353 286" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M590 302L683 302" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M806 166L806 258" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><text x="32" y="400" text-anchor="start" fill="#597276" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">蓝图中的回环表示“读完当前行后再次 step”；错误处理不意味着可以继续无条件循环。</text></svg>
