<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">VFS 加密必须覆盖完整文件与恢复路径</title><desc id="svg-desc">SQLite 通过 VFS 访问主数据库、rollback journal、WAL、临时文件和锁；只加密主文件是不完整的。</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#147f80"/></marker>
 <marker id="arrow-rust" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c76743"/></marker>
 <style>
 .bg{fill:#fffdf9}.teal{fill:#dff1eb;stroke:#147f80;stroke-width:2}.rust{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#eeeafd;stroke:#7161b5;stroke-width:2}.gold{fill:#fbf1d9;stroke:#a77b28;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arrow)}.line-r{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arrow-rust)}.dash{stroke:#8c9c98;stroke-width:2;stroke-dasharray:7 7;fill:none}.head{font:700 29px system-ui,sans-serif;fill:#153438}.label{font:700 21px system-ui,sans-serif;fill:#203035}.small{font:17px system-ui,sans-serif;fill:#53676d}.tiny{font:15px system-ui,sans-serif;fill:#53676d}
 </style>
</defs>
<rect class="bg" width="1000" height="560" rx="22"/>
<text x="48" y="52" class="head">VFS 加密必须覆盖完整文件与恢复路径</text>
<rect x="55" y="135" width="230" height="260" rx="16" class="teal"/><text x="170" y="175" text-anchor="middle" class="label">SQLite 核心</text><text x="170" y="215" text-anchor="middle" class="small">Pager / B-Tree</text><text x="170" y="250" text-anchor="middle" class="small">事务与恢复</text><text x="170" y="285" text-anchor="middle" class="small">WAL / Journal</text><text x="170" y="320" text-anchor="middle" class="small">临时文件</text><path d="M285 265 H365" class="line"/><rect x="365" y="135" width="250" height="260" rx="16" class="violet"/><text x="490" y="175" text-anchor="middle" class="label">自定义 VFS</text><text x="490" y="215" text-anchor="middle" class="small">xOpen / xRead / xWrite</text><text x="490" y="250" text-anchor="middle" class="small">xSync / xTruncate</text><text x="490" y="285" text-anchor="middle" class="small">lock / shm / file control</text><text x="490" y="320" text-anchor="middle" class="small">认证与错误恢复</text><path d="M615 265 H695" class="line"/><rect x="695" y="135" width="250" height="260" rx="16" class="rust"/><text x="820" y="175" text-anchor="middle" class="label">底层存储</text><text x="820" y="215" text-anchor="middle" class="small">database file</text><text x="820" y="250" text-anchor="middle" class="small">-journal / -wal</text><text x="820" y="285" text-anchor="middle" class="small">shared memory</text><text x="820" y="320" text-anchor="middle" class="small">temp / backup</text><rect x="125" y="435" width="750" height="72" rx="13" class="gold"/><text x="500" y="465" text-anchor="middle" class="label">加密合同：AEAD / nonce 唯一性 / KDF / key rotation / crash recovery</text><text x="500" y="491" text-anchor="middle" class="small">tracing VFS 只观察 xOpen；它不是加密实现，也不改变文件字节</text>
</svg>