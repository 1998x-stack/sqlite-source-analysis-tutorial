<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">SQLite canonical source 到定制产物的构建链</title><desc id="svg-desc">编译选项应在 canonical source、生成工具、amalgamation 和最终链接阶段保持一致。</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#147f80"/></marker>
 <marker id="arrow-rust" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c76743"/></marker>
 <style>
 .bg{fill:#fffdf9}.teal{fill:#dff1eb;stroke:#147f80;stroke-width:2}.rust{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#eeeafd;stroke:#7161b5;stroke-width:2}.gold{fill:#fbf1d9;stroke:#a77b28;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arrow)}.line-r{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arrow-rust)}.dash{stroke:#8c9c98;stroke-width:2;stroke-dasharray:7 7;fill:none}.head{font:700 29px system-ui,sans-serif;fill:#153438}.label{font:700 21px system-ui,sans-serif;fill:#203035}.small{font:17px system-ui,sans-serif;fill:#53676d}.tiny{font:15px system-ui,sans-serif;fill:#53676d}
 </style>
</defs>
<rect class="bg" width="1000" height="560" rx="22"/>
<text x="48" y="52" class="head">SQLite canonical source 到定制产物的构建链</text>
<rect x="55" y="145" width="185" height="110" rx="14" class="teal"/><text x="147" y="185" text-anchor="middle" class="label">Canonical source</text><text x="147" y="218" text-anchor="middle" class="small">src/ + tool/</text><path d="M240 200 H290" class="line"/><rect x="290" y="145" width="185" height="110" rx="14" class="gold"/><text x="382" y="185" text-anchor="middle" class="label">生成阶段</text><text x="382" y="218" text-anchor="middle" class="small">Lemon / keywordhash</text><path d="M475 200 H525" class="line"/><rect x="525" y="145" width="185" height="110" rx="14" class="violet"/><text x="617" y="185" text-anchor="middle" class="label">Amalgamation</text><text x="617" y="218" text-anchor="middle" class="small">sqlite3.c / sqlite3.h</text><path d="M710 200 H760" class="line"/><rect x="760" y="145" width="185" height="110" rx="14" class="rust"/><text x="852" y="185" text-anchor="middle" class="label">Compiler / linker</text><text x="852" y="218" text-anchor="middle" class="small">flags / ABI / platform</text><path d="M852 255 V340" class="line"/><rect x="675" y="340" width="270" height="100" rx="14" class="teal"/><text x="810" y="380" text-anchor="middle" class="label">SQLite library + app</text><text x="810" y="412" text-anchor="middle" class="small">PRAGMA compile_options</text><path d="M675 390 H530" class="line"/><rect x="260" y="340" width="270" height="100" rx="14" class="gold"/><text x="395" y="380" text-anchor="middle" class="label">Tests + source ID</text><text x="395" y="412" text-anchor="middle" class="small">functional / recovery / ABI</text><path d="M395 340 V290 H147 V255" class="dash"/><text x="50" y="500" class="small">OMIT 宏的生成工具与最终编译必须一致；不能假设 amalgamation 支持所有裁剪组合。</text>
</svg>