<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="th24a-title th24a-desc"><title id="th24a-title">四套相互独立的测试框架围绕 SQLite 核心库</title><desc id="th24a-desc">TCL 测试公开且是开发主力，TH3 是专有套件并提供 100% branch 与 MC/DC 覆盖，SLT 跨多个数据库引擎对比结果，dbsqlfuzz 同时变异 SQL 与数据库文件。</desc><rect x="0" y="0" width="960" height="420" fill="#fbfcfa"/><defs><marker id="ar24a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">四套独立维护的测试框架，不是一个“测试脚本”</text><rect x="330" y="150" width="300" height="96" rx="14" fill="#e8f3ef" stroke="#167c7b" stroke-width="2.4"/><text x="480" y="188" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#147f80">SQLite 核心库</text><text x="480" y="216" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#2c5054">被测试对象（as-deployed 配置）</text><rect x="26" y="74" width="248" height="104" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="1.8"/><text x="150" y="104" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#4b3a6b">TCL Tests</text><text x="150" y="130" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#4b3a6b">公开，开发主力测试</text><text x="150" y="154" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#537178">1390 文件 · 51445 用例</text><rect x="26" y="218" width="248" height="120" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="1.8"/><text x="150" y="248" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#8a4326">TH3（专有）</text><text x="150" y="274" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#8a4326">100% branch + 100% MC/DC</text><text x="150" y="298" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#537178">~1055 KSLOC 测试代码</text><text x="150" y="322" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#537178">50362 用例 → 全量 ~2.4M 实例</text><rect x="686" y="74" width="248" height="104" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="1.8"/><text x="810" y="104" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#147f80">SLT（SQL Logic Test）</text><text x="810" y="130" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#2c5054">与 PostgreSQL/MySQL 等对比</text><text x="810" y="154" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#537178">7.2M 查询 · 1.12GB 数据</text><rect x="686" y="218" width="248" height="120" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="1.8"/><text x="810" y="248" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#6b5a20">dbsqlfuzz（专有）</text><text x="810" y="274" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#6b5a20">同时变异 SQL 与库文件</text><text x="810" y="298" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#6b5a20">基于 libFuzzer · 336 种子文件</text><path d="M274 126 L330 175" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar24a)"/><path d="M274 278 L330 225" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar24a)"/><path d="M686 126 L630 175" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar24a)"/><path d="M686 278 L630 225" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar24a)"/><text x="26" y="384" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">规模数字来自官方 testing.html 的快照，会随版本变化；TH3 与 dbsqlfuzz 为专有产品，公开源码树不含 TH3。</text></svg>
