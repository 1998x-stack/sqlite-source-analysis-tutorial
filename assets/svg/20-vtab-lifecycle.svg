<svg xmlns="http://www.w3.org/2000/svg" width="960" height="438" viewBox="0 0 960 438" role="img" aria-labelledby="vtab20b-title vtab20b-desc"><title id="vtab20b-title">SQLite 虚拟表模块的连接与游标生命周期</title><desc id="vtab20b-desc">xCreate/xConnect 建立虚拟表句柄，xOpen 建游标，xFilter/Next/Column 提供行，xClose 关游标，xDisconnect/xDestroy 释放模块实例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="438" fill="#fbfcfa"/><text x="27" y="42" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">表的生命周期与查询游标的生命周期不同</text><rect x="26" y="103" width="220" height="97" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="136" y="132" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">xCreate / xConnect</text><text x="136" y="159" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">建 vtab 实例</text><rect x="273" y="103" width="220" height="97" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="383" y="132" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">xOpen / xFilter</text><text x="383" y="159" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">建 cursor + 设置扫描</text><rect x="520" y="103" width="220" height="97" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="630" y="132" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">xNext / xColumn</text><text x="630" y="159" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">按行提供值</text><rect x="767" y="103" width="166" height="97" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="850" y="132" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">xClose</text><text x="850" y="159" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">释放游标</text><path d="M246 149 L270 149" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M493 149 L517 149" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M740 149 L764 149" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect x="314" y="285" width="335" height="84" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="2"/><text x="481.5" y="314" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">xDisconnect / xDestroy</text><text x="481.5" y="341" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">连接结束或删除虚拟表</text><path d="M848 202 L486 282" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><text x="27" y="405" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#547177">xBestIndex 发生于规划阶段、可能调用多次；不能提前假设其参数与一次运行严格一一对应。</text></svg>
