<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v12b-title v12b-desc" viewBox="0 0 960 439" width="960" height="439"><title id="v12b-title">SQLite 单个 B-Tree 页面区域与偏移</title><desc id="v12b-desc">页 1 的 100 字节数据库头先于 B-tree 页头；叶页头 8 字节、内部页头 12 字节，紧跟按 key 排序的 cell 指针数组，中部为未分配空间，末端为 cell content/reserved。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="439" fill="#fbfcfa"/><text x="24" y="38" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">B-Tree 页内不等于连续存放的“记录数组”</text><rect x="40" y="78" width="882" height="48" rx="6" fill="#e8f1f4" stroke="#497387"/><text x="481" y="107" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#25474a" font-weight="750" text-anchor="middle">仅 page 1：100-byte 数据库文件头</text><rect x="40" y="139" width="220" height="66" rx="6" fill="#e2f3ed" stroke="#177b77"/><text x="150" y="177" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#25474a" font-weight="750" text-anchor="middle">B-Tree header</text><rect x="268" y="139" width="221" height="66" rx="6" fill="#eee9f9" stroke="#705fb5"/><text x="378.5" y="177" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#25474a" font-weight="750" text-anchor="middle">Cell pointer array</text><rect x="498" y="139" width="423" height="66" rx="6" fill="#edf6df" stroke="#6c8c32"/><text x="709.5" y="177" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#25474a" font-weight="750" text-anchor="middle">未分配区域 / freeblocks</text><rect x="40" y="226" width="882" height="67" rx="6" fill="#ffede4" stroke="#be6749"/><text x="481" y="264.5" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#25474a" font-weight="750" text-anchor="middle">Cell content（由页尾向前）</text><rect x="40" y="308" width="882" height="38" rx="6" fill="#fff4dc" stroke="#9b772e"/><text x="481" y="332" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#25474a" font-weight="750" text-anchor="middle">Reserved region（可能为 0）</text><text x="27" y="384" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#537077" font-weight="470" text-anchor="start">叶页头 8 字节、内部页头 12 字节；第 1 页的 B-Tree header 位于 byte offset 100。</text><text x="27" y="411" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#537077" font-weight="470" text-anchor="start">指针数组存储 cell 偏移；cell payload 过大时可分布于 overflow pages。</text></svg>
