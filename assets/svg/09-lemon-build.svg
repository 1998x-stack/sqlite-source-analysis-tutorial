<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="09a-title 09a-desc" viewBox="0 0 960 421" width="960" height="421"><title id="09a-title">SQLite Lemon 文法生成流程</title><desc id="09a-desc">parse.y 输入 Lemon 生成 parse.c 和 parse.h，解析器由 token 逐个驱动，源码中的 C action 在 reduce 时执行。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="421" fill="#f9fbf9"/><text x="32" y="39" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="20" font-weight="720">生成器在“编译 SQLite”之前运行，而非执行 SQL 时运行</text><rect x="34" y="103" width="250" height="89" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="159" y="133" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">src/parse.y</text><text x="159" y="160" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">规则 + 语义动作</text><rect x="351" y="103" width="250" height="89" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="476" y="133" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">tool/lemon.c</text><text x="476" y="160" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">LALR(1) parser generator</text><rect x="668" y="103" width="250" height="89" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="793" y="133" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">parse.c / parse.h</text><text x="793" y="160" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">解析状态机代码</text><path d="M284 148L348 148" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M601 148L665 148" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="220" y="265" width="250" height="77" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="345" y="295" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">tokenize.c</text><text x="345" y="322" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">逐个提交 token</text><rect x="545" y="265" width="250" height="77" rx="12" fill="#fff6df" stroke="#ab7b2c" stroke-width="1.6"/><text x="670" y="295" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">运行时 parser</text><text x="670" y="322" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">shift / reduce</text><path d="M805 195L690 262" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M470 305L541 305" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><text x="26" y="393" text-anchor="start" fill="#566f73" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">grammar 是人写的源，parse.c 是生成产物；调试规则优先打开 parse.y。</text></svg>
