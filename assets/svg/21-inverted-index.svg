<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="fts21a-title fts21a-desc"><title id="fts21a-title">LIKE 逐行扫描与倒排索引查词的对比</title><desc id="fts21a-desc">左侧 LIKE 查询必须逐篇文档比较文本；右侧倒排索引以词为键直接得到包含该词的文档列表 doclist。</desc><defs><marker id="ar21a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">两种“找包含某词的文档”路径</text><rect x="26" y="70" width="392" height="250" rx="14" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="222" y="102" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#8a4326">LIKE '%词%'：逐行比较</text><rect x="48" y="120" width="348" height="34" rx="8" fill="#fdf7f2" stroke="#d9a186" stroke-width="1"/><text x="62" y="143" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#4d6d71">row 1「…SQLite 性能…」→ 命中?</text><rect x="48" y="162" width="348" height="34" rx="8" fill="#fdf7f2" stroke="#d9a186" stroke-width="1"/><text x="62" y="185" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#4d6d71">row 2「数据库索引…」→ 命中?</text><rect x="48" y="204" width="348" height="34" rx="8" fill="#fdf7f2" stroke="#d9a186" stroke-width="1"/><text x="62" y="227" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#4d6d71">row 3「…优化器…」→ 命中?</text><text x="222" y="272" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" fill="#8a4326">每行都要读完整文本，成本随行数增长</text><text x="222" y="300" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" fill="#8a4326">且无法做短语、前缀、相关性排序</text><rect x="486" y="70" width="448" height="250" rx="14" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="710" y="102" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#147f80">倒排索引：词 → doclist</text><rect x="512" y="126" width="120" height="40" rx="8" fill="#d7ece6" stroke="#147f80" stroke-width="1.6"/><text x="572" y="152" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#24464b">sqlite</text><rect x="668" y="126" width="240" height="40" rx="8" fill="#fff" stroke="#147f80" stroke-width="1.2"/><text x="680" y="152" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#2c5054">docid 1,4,9 …（含词位置）</text><path d="M632 146 L664 146" stroke="#79939b" stroke-width="2.4" fill="none" marker-end="url(#ar21a)"/><rect x="512" y="186" width="120" height="40" rx="8" fill="#d7ece6" stroke="#147f80" stroke-width="1.6"/><text x="572" y="212" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#24464b">性能</text><rect x="668" y="186" width="240" height="40" rx="8" fill="#fff" stroke="#147f80" stroke-width="1.2"/><text x="680" y="212" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#2c5054">docid 1,7 …</text><path d="M632 206 L664 206" stroke="#79939b" stroke-width="2.4" fill="none" marker-end="url(#ar21a)"/><text x="710" y="272" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" fill="#147f80">先查词条，只回表取命中的少数文档</text><text x="710" y="300" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" fill="#147f80">doclist 存位置，因此支持短语与排序</text><text x="26" y="368" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" fill="#537178">docid 与位置为教学示意值；真实数值取决于文档内容、分词器与 SQLite 版本。</text></svg>
