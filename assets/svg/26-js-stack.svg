<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="wa26a-title wa26a-desc"><title id="wa26a-title">浏览器中 SQLite WASM 的分层</title><desc id="wa26a-desc">页面 JS 通过 capi、oo1 或 Worker1 接口调用由 C 编译成的 sqlite3 WASM 模块，模块再经 VFS 读写内存或 OPFS 存储。</desc><defs><marker id="ar26a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">SQLite 仍在 C 层运行，只是被编译成了 WASM</text><rect x="26" y="72" width="500" height="80" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="46" y="104" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="16" font-weight="700" fill="#147f80">页面 / Worker 中的 JavaScript</text><text x="46" y="132" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#2c5054">capi（C API 包装）· oo1（面向对象）· Worker1（独立 Worker）</text><rect x="26" y="170" width="500" height="80" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="46" y="202" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="16" font-weight="700" fill="#4b3a6b">sqlite3 WASM 模块</text><text x="46" y="230" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#4b3a6b">C 源码 → wasm 二进制 + 胶水 JS</text><rect x="26" y="268" width="500" height="80" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="46" y="300" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="16" font-weight="700" fill="#8a4326">VFS 层</text><text x="46" y="328" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">kvvfs · JsStorageDb · opfs · opfs-wl · opfs-sahpool</text><path d="M276 152 L276 166" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar26a)"/><path d="M276 250 L276 264" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar26a)"/><path d="M526 308 L620 308" stroke="#79939b" stroke-width="2.2" fill="none" marker-end="url(#ar26a)"/><rect x="624" y="170" width="310" height="178" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="779" y="202" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#3a4f7a">存储位置</text><text x="644" y="234" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#3a4f7a">内存：WASM 线性内存（刷新即丢）</text><text x="644" y="262" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#3a4f7a">持久：Origin Private File System</text><text x="644" y="290" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#3a4f7a">（OPFS 仅 Worker 线程可用）</text><text x="644" y="322" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#537178">会话级：localStorage/sessionStorage</text><text x="26" y="382" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">结构依据官方 wasm 文档（api-index / persistence）整理；具体文件与 API 名称以官方为准。</text></svg>
