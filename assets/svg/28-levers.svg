<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="cs28a-title cs28a-desc"><title id="cs28a-title">定制 SQLite 的三类杠杆</title><desc id="cs28a-desc">定制 SQLite 主要有三条路径：编译时选项剪裁功能、通过扩展注册 SQL 函数与虚拟表、通过自定义 VFS 改变存储与加密行为。</desc><defs><marker id="ar28a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">先选杠杆，再写代码</text><rect x="26" y="82" width="280" height="150" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="166" y="114" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#147f80">编译时选项</text><text x="46" y="146" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#2c5054">SQLITE_OMIT_*：去掉功能</text><text x="46" y="170" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#2c5054">SQLITE_ENABLE_*：加入扩展</text><text x="46" y="194" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#2c5054">需重新编译整个库</text><text x="46" y="218" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">影响是全局的、静态的</text><rect x="340" y="82" width="280" height="150" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="480" y="114" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#4b3a6b">扩展（Extension）</text><text x="360" y="146" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#4b3a6b">注册 SQL 函数 / 聚合 / 排序</text><text x="360" y="170" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#4b3a6b">注册虚拟表 / 表值函数</text><text x="360" y="194" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#4b3a6b">可静态链接或运行期加载</text><text x="360" y="218" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">不改核心库，可增量添加</text><rect x="654" y="82" width="280" height="150" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="794" y="114" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#8a4326">自定义 VFS</text><text x="674" y="146" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">改变文件 I/O：加密、内存、</text><text x="674" y="170" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">远程、压缩等</text><text x="674" y="194" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">官方加密产品是 SEE</text><text x="674" y="218" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">要小心自研加密的安全边界</text><rect x="26" y="268" width="908" height="70" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="1.8"/><text x="48" y="298" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="700" fill="#3a4f7a">多数“定制”需求用前两条就能解决；VFS 加密是门槛最高的一条。</text><text x="48" y="322" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#3a4f7a">无论走哪条，都要在目标平台上重跑测试；不能靠“本地编过”就宣称可用。</text><text x="26" y="378" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">编译选项以官方 compile.html 为准；具体可用宏随版本变化。</text></svg>
