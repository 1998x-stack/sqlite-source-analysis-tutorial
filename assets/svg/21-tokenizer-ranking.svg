<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">分词、匹配与排序是三段不同工作</title><desc id="desc">原始文本经过 tokenizer 形成 token，FTS5 查询命中 postings，再用 BM25/rank 排序并生成摘要。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#c76743"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.label{font-size:18px;font-weight:700}.head{font-size:23px;font-weight:700}.box{fill:#fffdf9;stroke:#b9c9c5;stroke-width:2}.teal{fill:#e4f3ef;stroke:#147f80;stroke-width:2}.terra{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#f0edfb;stroke:#7461ba;stroke-width:2}.gold{fill:#fff6df;stroke:#b28a2e;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arr)}.line2{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arr2)}.dash{stroke:#916c22;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<rect x="36" y="100" width="180" height="100" rx="14" class="box"/><text x="126" y="140" text-anchor="middle" class="label">原始文本</text><text x="126" y="170" text-anchor="middle" class="small">SQLite 数据库引擎</text>
<path d="M216 150 H276" class="line"/><rect x="280" y="100" width="190" height="100" rx="14" class="teal"/><text x="375" y="140" text-anchor="middle" class="label">unicode61</text><text x="375" y="170" text-anchor="middle" class="small">连续 token 字符运行</text>
<path d="M470 150 H530" class="line"/><rect x="534" y="100" width="180" height="100" rx="14" class="violet"/><text x="624" y="140" text-anchor="middle" class="label">MATCH</text><text x="624" y="170" text-anchor="middle" class="small">term / phrase / NEAR</text>
<path d="M714 150 H770" class="line"/><rect x="774" y="100" width="150" height="100" rx="14" class="terra"/><text x="849" y="140" text-anchor="middle" class="label">BM25 / rank</text><text x="849" y="170" text-anchor="middle" class="small">越低越靠前</text>
<rect x="56" y="270" width="400" height="130" rx="14" class="gold"/><text x="80" y="306" class="label">中文分词边界</text><text x="80" y="340" class="small">unicode61 把连续 token 字符视为一个 token</text><text x="80" y="368" class="small">不会自动做中文词语切分</text>
<rect x="500" y="270" width="400" height="130" rx="14" class="box"/><text x="524" y="306" class="label">需要不同检索语义时</text><text x="524" y="340" class="small">trigram：连续三个字符形成 token</text><text x="524" y="368" class="small">custom tokenizer：接入领域词典与语言规则</text>
<text x="56" y="454" class="small">highlight 与 snippet 负责呈现命中上下文，不改变 tokenizer 的规则。</text></svg>