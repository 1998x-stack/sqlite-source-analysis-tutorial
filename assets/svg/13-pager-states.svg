<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v13b-title v13b-desc" viewBox="0 0 960 426" width="960" height="426"><title id="v13b-title">Rollback 模式下的 Pager 写事务状态示意</title><desc id="v13b-desc">读状态 READER 进入 WRITER_LOCKED，修改缓存后为 WRITER_CACHEMOD，某些执行路径中进入 WRITER_DBMOD 或 WRITER_FINISHED，commit 或 rollback 后回归可用状态，错误处理可能进入 ERROR。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="426" fill="#fbfcfa"/><text x="25" y="40" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">Pager 状态不是“页面被锁就可立即写入磁盘”</text><rect x="23" y="98" width="186" height="91" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="116" y="128" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">READER</text><text x="116" y="156" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">已建立读取视图</text><rect x="252" y="98" width="197" height="91" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="350.5" y="128" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">WRITER_LOCKED</text><text x="350.5" y="156" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">准备写事务</text><rect x="493" y="98" width="211" height="91" rx="12" fill="#fff4dc" stroke="#9b772e" stroke-width="1.6"/><text x="598.5" y="128" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">WRITER_CACHEMOD</text><text x="598.5" y="156" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">已修改缓存页</text><rect x="747" y="98" width="186" height="91" rx="12" fill="#ffede4" stroke="#be6749" stroke-width="1.6"/><text x="840" y="128" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">WRITER_DBMOD</text><text x="840" y="156" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">数据库可能被写</text><path d="M209 143L250 143" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M449 143L490 143" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M704 143L744 143" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><rect x="423" y="258" width="260" height="83" rx="12" fill="#eee9f9" stroke="#705fb5" stroke-width="1.6"/><text x="553" y="288" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">WRITER_FINISHED</text><text x="553" y="316" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">提交协议的后期状态</text><rect x="44" y="258" width="260" height="83" rx="12" fill="#ffede4" stroke="#be6749" stroke-width="1.6"/><text x="174" y="288" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">ERROR / rollback</text><text x="174" y="316" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">按代码路径清理</text><path d="M838 191L558 254" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M143 190L143 254" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" stroke-dasharray="6 5"/><text x="27" y="394" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#557279" font-weight="470" text-anchor="start">教学抽象：具体跃迁受 journal mode、提交阶段和错误路径影响；WAL 不沿同一条严格轨迹。</text></svg>
