<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">表达式索引匹配看语法树，不做代数证明</title><desc id="desc">x+y 与索引表达式 x+y 匹配；y+x 虽数学等价，SQLite planner 不会自动做代数化简来匹配索引。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#c76743"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.label{font-size:18px;font-weight:700}.head{font-size:23px;font-weight:700}.box{fill:#fffdf9;stroke:#b9c9c5;stroke-width:2}.teal{fill:#e4f3ef;stroke:#147f80;stroke-width:2}.terra{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#f0edfb;stroke:#7461ba;stroke-width:2}.gold{fill:#fff6df;stroke:#b28a2e;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arr)}.line2{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arr2)}.dash{stroke:#916c22;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<rect x="54" y="78" width="350" height="112" rx="14" class="teal"/><text x="229" y="118" text-anchor="middle" class="label">CREATE INDEX idx ON t(x+y)</text><text x="229" y="154" text-anchor="middle" class="small">索引表达式树：ADD(x,y)</text>
<path d="M404 134 H512" class="line"/>
<rect x="520" y="64" width="370" height="92" rx="14" class="teal"/><text x="705" y="100" text-anchor="middle" class="label">WHERE x+y = 22</text><text x="705" y="132" text-anchor="middle" class="small">同一表达式结构 · 可匹配</text>
<rect x="520" y="194" width="370" height="92" rx="14" class="terra"/><text x="705" y="230" text-anchor="middle" class="label">WHERE y+x = 22</text><text x="705" y="262" text-anchor="middle" class="small">交换操作数 · 不是同一表达式</text>
<path d="M229 190 V358 H705 V288" class="dash"/>
<rect x="54" y="360" width="350" height="92" rx="14" class="gold"/><text x="229" y="397" text-anchor="middle" class="label">确定性约束</text><text x="229" y="428" text-anchor="middle" class="small">相同输入必须得到稳定结果</text>
<text x="520" y="406" class="small">表达式索引只允许引用本表列、确定性函数；不允许子查询。</text></svg>