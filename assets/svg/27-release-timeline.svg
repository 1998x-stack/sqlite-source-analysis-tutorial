<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">SQLite 2026 版本维护时间线</title><desc id="svg-desc">3.52.0 撤回、3.53.0 重新发布并持续维护、3.54.0 发布和 3.54.1 补丁，以及 3.53.6 维护分支。</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#147f80"/></marker>
 <marker id="arrow-rust" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c76743"/></marker>
 <style>
 .bg{fill:#fffdf9}.teal{fill:#dff1eb;stroke:#147f80;stroke-width:2}.rust{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#eeeafd;stroke:#7161b5;stroke-width:2}.gold{fill:#fbf1d9;stroke:#a77b28;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arrow)}.line-r{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arrow-rust)}.dash{stroke:#8c9c98;stroke-width:2;stroke-dasharray:7 7;fill:none}.head{font:700 29px system-ui,sans-serif;fill:#153438}.label{font:700 21px system-ui,sans-serif;fill:#203035}.small{font:17px system-ui,sans-serif;fill:#53676d}.tiny{font:15px system-ui,sans-serif;fill:#53676d}
 </style>
</defs>
<rect class="bg" width="1000" height="560" rx="22"/>
<text x="48" y="52" class="head">SQLite 2026 版本维护时间线</text>
<path d="M95 280 H915" stroke="#9eaaa6" stroke-width="5" fill="none"/><circle cx="135" cy="280" r="14" fill="#c76743"/><circle cx="335" cy="280" r="14" fill="#147f80"/><circle cx="575" cy="280" r="14" fill="#7161b5"/><circle cx="735" cy="280" r="14" fill="#147f80"/><circle cx="875" cy="280" r="14" fill="#c76743"/>
<path d="M135 265 V180" class="line-r"/><path d="M335 265 V180" class="line"/><path d="M575 265 V180" class="line"/><path d="M735 265 V180" class="line"/><path d="M875 265 V180" class="line-r"/>
<rect x="55" y="95" width="160" height="82" rx="12" class="rust"/><text x="135" y="127" text-anchor="middle" class="label">3.52.0</text><text x="135" y="153" text-anchor="middle" class="small">撤回</text><rect x="245" y="95" width="180" height="82" rx="12" class="teal"/><text x="335" y="127" text-anchor="middle" class="label">3.53.0</text><text x="335" y="153" text-anchor="middle" class="small">4 月 9 日</text><rect x="490" y="95" width="170" height="82" rx="12" class="violet"/><text x="575" y="127" text-anchor="middle" class="label">3.53.x</text><text x="575" y="153" text-anchor="middle" class="small">维护补丁</text><rect x="665" y="95" width="140" height="82" rx="12" class="teal"/><text x="735" y="127" text-anchor="middle" class="label">3.54.0</text><text x="735" y="153" text-anchor="middle" class="small">10 月 9 日</text><rect x="805" y="95" width="140" height="82" rx="12" class="rust"/><text x="875" y="127" text-anchor="middle" class="label">3.54.1</text><text x="875" y="153" text-anchor="middle" class="small">10 月 16 日</text><path d="M575 294 V380 H835 V400" class="line-r"/><rect x="740" y="400" width="190" height="65" rx="12" class="gold"/><text x="835" y="428" text-anchor="middle" class="label">3.53.6</text><text x="835" y="450" text-anchor="middle" class="tiny">11 月 13 日</text><text x="48" y="505" class="small">分支维护日期可晚于较高版本号；不要把 chronology 排序误读成版本号替代。</text>
</svg>