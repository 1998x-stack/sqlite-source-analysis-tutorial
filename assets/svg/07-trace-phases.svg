<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07b-title 07b-desc" viewBox="0 0 960 408" width="960" height="408"><title id="07b-title">代码生成 trace 和指令执行 trace 的时间区别</title><desc id="07b-desc">准备语句期间生成 VDBE opcode，step 运行时再执行 opcode；二者观测点不同，不能把 addoptrace 等同于执行追踪。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="408" fill="#f9fbf9"/><text x="32" y="40" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="21" font-weight="720">准备时“写指令”，运行时“跑指令”</text><rect x="38" y="95" width="267" height="92" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="171.5" y="125" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">sqlite3_prepare_v2</text><text x="171.5" y="152" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">生成与追加 opcode</text><rect x="348" y="95" width="267" height="92" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="481.5" y="125" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">sqlite3_stmt*</text><text x="481.5" y="152" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">已有字节码</text><rect x="658" y="95" width="267" height="92" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="791.5" y="125" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">sqlite3_step</text><text x="791.5" y="152" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">执行 opcode / 返回行</text><path d="M305 141L344 141" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M615 141L655 141" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="65" y="247" width="378" height="87" rx="12" fill="#fff6df" stroke="#ab7b2c" stroke-width="1.6"/><text x="254" y="277" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">vdbe_addoptrace（调试构建）</text><text x="254" y="304" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">查看 opcode 添加时机 / 来源</text><rect x="516" y="247" width="378" height="87" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="705" y="277" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">vdbe_trace（调试构建）</text><text x="705" y="304" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">观察实际执行时的指令</text><path d="M180 190L180 245" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M791 190L791 245" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><text x="27" y="375" text-anchor="start" fill="#506d72" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">sqlite3_trace_v2 是公开的事件接口，观察 SQL / 行 / profile，不直接等于调试版 opcode trace。</text></svg>
