<svg xmlns="http://www.w3.org/2000/svg" width="950" height="350" viewBox="0 0 950 350" role="img" aria-labelledby="t-03ps d-03ps"><title id="t-03ps">prepare 与 step 的时序分界</title><desc id="d-03ps">prepare 编译 SQL 生成 sqlite3_stmt；step 重复运行该 prepared statement，产生零至多行 SQLITE_ROW，最后 SQLITE_DONE。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#789395"/></marker></defs><rect width="950" height="350" fill="#f9fbf9"/><text x="32" y="42" text-anchor="start" fill="#23494d" font-size="20" font-weight="800" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">prepare 与 step 不是“同一次执行”</text><rect x="30" y="98" width="250" height="110" rx="14" fill="#fff0e6" stroke="#c66b48" stroke-width="1.6"/><text x="155" y="129" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">sqlite3_prepare_v2</text><text x="155" y="156" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">SQL → sqlite3_stmt</text><rect x="350" y="98" width="250" height="110" rx="14" fill="#ece9f7" stroke="#7763b5" stroke-width="1.6"/><text x="475" y="129" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">sqlite3_step</text><text x="475" y="156" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">执行指令 → 返回状态</text><rect x="670" y="98" width="250" height="110" rx="14" fill="#e7edef" stroke="#315c69" stroke-width="1.6"/><text x="795" y="129" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">sqlite3_finalize</text><text x="795" y="156" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">释放语句资源</text><path d="M280 149L347 149" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M600 149L667 149" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><text x="472" y="253" text-anchor="middle" fill="#1e7775" font-size="16" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">SQLITE_ROW → 读取列 → 再次 step()</text><path d="M550 210L550 272" fill="none" stroke="#ba8160" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M550 272L416 272" fill="none" stroke="#ba8160" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M416 272L416 210" fill="none" stroke="#ba8160" stroke-width="2.5"  marker-end="url(#arr)"/><text x="472" y="321" text-anchor="middle" fill="#243f43" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">直到 SQLITE_DONE 或错误；重复执行前可 reset / clear_bindings</text></svg>
