<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-labelledby="lock17a-title lock17a-desc"><title id="lock17a-title">Rollback journal 模式的五种文件锁状态</title><desc id="lock17a-desc">NONE SHARED RESERVED PENDING EXCLUSIVE 是经典锁状态，PENDING 是阻止新读者进入的中间状态，Pager 不一定单独持久记录它。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="424" fill="#fbfcfa"/><text x="29" y="39" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">Rollback 锁协调：不是每个连接都顺序经过所有状态</text><rect x="23" y="100" width="171" height="94" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="108.5" y="129" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">NONE</text><text x="108.5" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">未持读写锁</text><rect x="216" y="100" width="171" height="94" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="301.5" y="129" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">SHARED</text><text x="301.5" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">多个读者</text><rect x="410" y="100" width="171" height="94" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="2"/><text x="495.5" y="129" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">RESERVED</text><text x="495.5" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">一个预写者</text><rect x="604" y="100" width="171" height="94" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="689.5" y="129" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">PENDING</text><text x="689.5" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">等待旧读者退出</text><rect x="795" y="100" width="143" height="94" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="866.5" y="129" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">EXCLUSIVE</text><text x="866.5" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">写主库</text><path d="M194 147 L213 147" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M387 147 L408 147" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M581 147 L601 147" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M775 147 L793 147" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect x="48" y="290" width="404" height="35" rx="16" fill="#e8f3ef" stroke="#167c7b" stroke-width=".8"/><text x="250" y="314" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5054">SHARED 与 RESERVED 可在特定情形并存</text><rect x="508" y="290" width="402" height="35" rx="16" fill="#ffefe5" stroke="#bc6b48" stroke-width=".8"/><text x="709" y="314" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5054">PENDING 会阻止新的 SHARED 进入</text><text x="27" y="390" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#567176">WAL 模式用不同的 WAL/共享内存锁协调；不要直接照搬这条 rollback 锁链。</text></svg>
