<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06c-title 06c-desc" viewBox="0 0 960 409" width="960" height="409"><title id="06c-title">存储底层错误如何传播至 SQLite C API</title><desc id="06c-desc">VFS 执行文件操作产生底层错误，Pager / B-Tree / VDBE 会传播或转换为 SQLite 结果码，调用者在 API 边界获取 rc、errmsg 等。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="409" fill="#f9fbf9"/><text x="27" y="39" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="21" font-weight="720">从 I/O 失败到应用日志</text><rect x="26" y="94" width="190" height="88" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="121" y="124" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">VFS</text><text x="121" y="151" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">xRead / xWrite</text><rect x="266" y="94" width="190" height="88" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="361" y="124" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">Pager</text><text x="361" y="151" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">页面 / 日志 / 事务</text><rect x="505" y="94" width="190" height="88" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="600" y="124" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">B-Tree / VDBE</text><text x="600" y="151" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">调用链传播</text><rect x="744" y="94" width="190" height="88" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="839" y="124" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">应用 C API</text><text x="839" y="151" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">rc 与错误信息</text><path d="M216 140L263 140" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M456 140L502 140" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M695 140L741 140" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="135" y="248" width="305" height="79" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="287.5" y="278" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">主结果码</text><text x="287.5" y="305" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">SQLITE_IOERR 等</text><rect x="520" y="248" width="305" height="79" rx="12" fill="#fff6df" stroke="#ab7b2c" stroke-width="1.6"/><text x="672.5" y="278" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">扩展错误码 / 字符串</text><text x="672.5" y="305" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">在出错后尽快复制</text><path d="M850 184L850 214" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M850 214L674 248" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M850 214L289 248" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><text x="27" y="375" text-anchor="start" fill="#4e6d74" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">错误状态是连接上的“最近状态”，后续 SQLite API 可能覆盖；不要把它当成永久异常对象。</text></svg>
