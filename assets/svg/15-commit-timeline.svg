<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v15a-title v15a-desc" viewBox="0 0 960 440" width="960" height="440"><title id="v15a-title">DELETE 回滚日志模式的提交关键顺序</title><desc id="v15a-desc">Rollback DELETE 模式提交期间需要保存旧页于 journal，按同步约束使 journal 持久，再修改并同步数据库页，最后删除 journal 作为典型提交标志。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="440" fill="#fbfcfa"/><text x="26" y="39" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">原子提交为什么要求“先保护旧页，再写新页”？</text><rect x="20" y="103" width="214" height="93" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="127" y="133" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">① 保存旧页</text><text x="127" y="161" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">journal: pre-image</text><rect x="261" y="103" width="214" height="93" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="368" y="133" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">② journal sync</text><text x="368" y="161" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">遵循同步级别</text><rect x="502" y="103" width="214" height="93" rx="12" fill="#ffede4" stroke="#be6749" stroke-width="1.6"/><text x="609" y="133" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">③ 数据库页写入</text><text x="609" y="161" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">xWrite + 必要的 sync</text><rect x="741" y="103" width="198" height="93" rx="12" fill="#edf6df" stroke="#6c8c32" stroke-width="1.6"/><text x="840" y="133" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">④ 提交标记</text><text x="840" y="161" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">DELETE 模式 journal 删除</text><path d="M234 148L258 148" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M475 148L499 148" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M716 148L738 148" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><rect x="105" y="279" width="328" height="83" rx="12" fill="#fff4dc" stroke="#9b772e" stroke-width="1.6"/><text x="269" y="309" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">中途崩溃</text><text x="269" y="337" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">可依 hot journal 还原旧页</text><rect x="552" y="279" width="328" height="83" rx="12" fill="#eee9f9" stroke="#705fb5" stroke-width="1.6"/><text x="716" y="309" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">安全假设</text><text x="716" y="337" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">VFS / 设备诚实履行 sync</text><path d="M360 199L267 276" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M628 198L716 275" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><text x="27" y="413" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#567178" font-weight="470" text-anchor="start">图仅表示 DELETE + rollback 的主要顺序；TRUNCATE/PERSIST/WAL 采用不同提交标记。</text></svg>
