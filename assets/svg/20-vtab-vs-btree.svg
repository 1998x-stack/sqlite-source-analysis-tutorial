<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" aria-labelledby="vtab20c-title vtab20c-desc"><title id="vtab20c-title">虚拟表数据源与真实 B-Tree 表的差异</title><desc id="vtab20c-desc">普通表以 SQLite B-Tree 和 Pager 为数据来源，虚拟表由 module 自行控制游标和数据源；模块可选择文件、内存、应用状态或其它实现。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="432" fill="#fbfcfa"/><text x="28" y="39" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">虚拟表提供 SQL 接口，不强制使用 SQLite B-Tree 存储</text><rect x="29" y="107" width="255" height="95" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="156.5" y="136" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">SELECT ... FROM source</text><text x="156.5" y="163" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">共同的 SQL / VDBE 层</text><rect x="359" y="94" width="260" height="95" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="489" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">普通表</text><text x="489" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">B-Tree → Pager → VFS</text><rect x="674" y="94" width="261" height="95" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="804.5" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">虚拟表</text><text x="804.5" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">Module → external/virtual</text><path d="M284 148 L356 148" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M284 168 L673 168" stroke="#79939b" stroke-width="2.4" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/><rect x="384" y="275" width="232" height="83" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="2"/><text x="500" y="304" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">数据库文件页</text><text x="500" y="331" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">标准 SQLite 文件格式</text><rect x="685" y="275" width="235" height="83" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="802.5" y="304" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">JSON / memory / custom</text><text x="802.5" y="331" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">由具体模块实现</text><path d="M489 192 L489 272" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M804 192 L804 272" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><text x="27" y="405" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#557279">generate_series 通常在 SQLite CLI 中可用，不应当成所有 SQLite 核心库内置函数。</text></svg>
