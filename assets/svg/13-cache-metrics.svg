<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v13c-title v13c-desc" viewBox="0 0 960 425" width="960" height="425"><title id="v13c-title">Page-cache 观察与参数变化</title><desc id="v13c-desc">cache_hit / cache_miss 等是缓存统计而非磁盘物理 I/O 指标；PRAGMA cache_size 正数按页数、负数按近似 KiB 建议上限。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="425" fill="#fbfcfa"/><text x="28" y="40" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">缓存效率需要用观测窗口和工作负载解释</text><rect x="33" y="93" width="279" height="102" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="172.5" y="123" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">PRAGMA cache_size = 128</text><text x="172.5" y="151" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">建议缓存页数（正数）</text><rect x="348" y="93" width="279" height="102" rx="12" fill="#eee9f9" stroke="#705fb5" stroke-width="1.6"/><text x="487.5" y="123" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">PRAGMA cache_size = -1024</text><text x="487.5" y="151" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">约 1 MiB（负数）</text><rect x="663" y="93" width="265" height="102" rx="12" fill="#fff4dc" stroke="#9b772e" stroke-width="1.6"/><text x="795.5" y="123" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">DBSTATUS CACHE_*</text><text x="795.5" y="151" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">缓存计数统计</text><path d="M171 200L171 254" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M482 200L482 254" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M793 200L793 254" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><rect x="32" y="264" width="280" height="83" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="172" y="294" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">同一 SQL 工作负载</text><text x="172" y="322" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">相同页面大小与 schema</text><rect x="345" y="264" width="282" height="83" rx="12" fill="#edf6df" stroke="#6c8c32" stroke-width="1.6"/><text x="486" y="294" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">缓存未必立即占满</text><text x="486" y="322" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">建议值不是实时占用</text><rect x="663" y="264" width="265" height="83" rx="12" fill="#ffede4" stroke="#be6749" stroke-width="1.6"/><text x="795.5" y="294" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">多次测量</text><text x="795.5" y="322" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">区分冷 / 热缓存</text><text x="28" y="397" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#557277" font-weight="470" text-anchor="start">Cache hit 不等于 OS 页缓存命中，MISS 也不能等同于一次机械磁盘读取。</text></svg>
