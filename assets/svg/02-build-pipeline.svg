<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="t-02b d-02b"><title id="t-02b">SQLite 从源文件到可执行程序</title><desc id="d-02b">由 canonical source 经过预处理与代码生成，形成 sqlite3.c/sqlite3.h，最终由 C 编译器编译成库及 CLI。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#789395"/></marker></defs><rect width="960" height="380" fill="#f9fbf9"/><text x="28" y="42" text-anchor="start" fill="#23494d" font-size="20" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">“源码”不等于“直接送进编译器的输入”</text><rect x="35" y="100" width="208" height="88" rx="14" fill="#e3f2ec" stroke="#18847d" stroke-width="1.6"/><text x="139" y="131" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">canonical source</text><text x="139" y="158" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">src/ · tool/ · ext/</text><rect x="306" y="100" width="208" height="88" rx="14" fill="#ece9f7" stroke="#7763b5" stroke-width="1.6"/><text x="410" y="131" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">生成 / 预处理</text><text x="410" y="158" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Lemon · Tcl · mk...</text><rect x="578" y="100" width="208" height="88" rx="14" fill="#fff0e6" stroke="#c66b48" stroke-width="1.6"/><text x="682" y="131" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">合并版</text><text x="682" y="158" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">sqlite3.c · sqlite3.h</text><path d="M243 144L303 144" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M514 144L575 144" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="320" y="259" width="208" height="87" rx="14" fill="#e7edef" stroke="#315c69" stroke-width="1.6"/><text x="424" y="290" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">C 编译器</text><text x="424" y="317" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">CC + SQLITE_* 宏</text><rect x="660" y="259" width="208" height="87" rx="14" fill="#fff4d9" stroke="#ab7b25" stroke-width="1.6"/><text x="764" y="290" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">最终产物</text><text x="764" y="317" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">库 / SQLite CLI</text><path d="M678 190L424 256" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M528 301L657 301" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><text x="26" y="366" text-anchor="start" fill="#49686c" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">shell.c 是 CLI 的入口源文件；合并版并不包含交互式 shell 的 main()</text></svg>
