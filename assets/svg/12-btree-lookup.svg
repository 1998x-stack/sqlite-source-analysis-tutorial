<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v12a-title v12a-desc" viewBox="0 0 960 427" width="960" height="427"><title id="v12a-title">table b-tree 与 index b-tree 的查找差异</title><desc id="v12a-desc">Rowid table 的内部页保存 rowid 分隔键与子指针、叶页保存 rowid 和记录；index b-tree 内部和叶都存储 key。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="427" fill="#fbfcfa"/><text x="26" y="42" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">两种 B-Tree：不是“所有 SQLite 表都是 B+Tree”</text><rect x="35" y="99" width="390" height="88" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="230" y="129" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Rowid table B-Tree</text><text x="230" y="157" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">内部页：rowid + 子页；叶：rowid + 行</text><rect x="535" y="99" width="390" height="88" rx="12" fill="#eee9f9" stroke="#705fb5" stroke-width="1.6"/><text x="730" y="129" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Index B-Tree</text><text x="730" y="157" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">内部 / 叶：索引键（可包含 rowid）</text><rect x="79" y="250" width="302" height="84" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="230" y="280" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Leaf：rowid → record</text><text x="230" y="308" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">大记录可溢出至 overflow page</text><rect x="580" y="250" width="302" height="84" rx="12" fill="#ffede4" stroke="#be6749" stroke-width="1.6"/><text x="731" y="280" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Index key → search</text><text x="731" y="308" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">WITHOUT ROWID 也使用 index b-tree</text><path d="M229 192L229 247" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M731 192L731 247" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><text x="27" y="394" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#537279" font-weight="470" text-anchor="start">两棵树都有多页内节点与叶节点；图中只画逻辑键关系，不表示页内字节布局。</text></svg>
