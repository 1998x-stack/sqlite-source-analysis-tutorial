<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="fe27a-title fe27a-desc"><title id="fe27a-title">2026 年三个发布节点与代表性变更</title><desc id="fe27a-desc">3.53.0 于 2026-04-09 发布，带来 QRF、17 位浮点、ALTER TABLE 约束增删、REINDEX EXPRESSIONS 等；3.54.0 于 2026-10-09 发布，聚焦 CLI 与平台；3.54.1 于 2026-10-16 修复 32 位构建问题。</desc><defs><marker id="ar27a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">先把版本与日期放对</text><path d="M60 110 L900 110" stroke="#79939b" stroke-width="2.4" fill="none" marker-end="url(#ar27a)"/><circle cx="150" cy="110" r="7" fill="#167c7b"/><circle cx="480" cy="110" r="7" fill="#bc6b48"/><circle cx="760" cy="110" r="7" fill="#8662a9"/><rect x="40" y="130" width="250" height="200" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="165" y="160" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#147f80">3.53.0 · 2026-04-09</text><text x="60" y="190" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#2c5054">• WAL-reset 数据损坏修复</text><text x="60" y="214" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#2c5054">• QRF 结果格式化库</text><text x="60" y="238" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#2c5054">• 浮点默认 17 位有效数字</text><text x="60" y="262" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#2c5054">• ALTER TABLE 增/删 NOT NULL、CHECK</text><text x="60" y="286" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#2c5054">• REINDEX EXPRESSIONS；自修复过期表达式索引</text><text x="60" y="310" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#2c5054">• EXCEPT/INTERSECT/UNION 改用排序合并</text><rect x="330" y="130" width="270" height="200" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="465" y="160" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#8a4326">3.54.0 · 2026-10-09</text><text x="350" y="190" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">• CLI 提示符状态转义、PS1/PS2</text><text x="350" y="214" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">• diskused() 扩展与 .diskused</text><text x="350" y="238" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">• .mode --ifmt/--fpfmt/--titles</text><text x="350" y="262" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">• sqlite3_result_str()/sqlite3_incomplete()</text><text x="350" y="286" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">• 临时文件用 O_TMPFILE（支持的平台）</text><text x="350" y="310" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">• Windows 用 SRWL 非递归 mutex；弃 XP</text><rect x="640" y="130" width="290" height="200" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="785" y="160" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#4b3a6b">3.54.1 · 2026-10-16</text><text x="660" y="190" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#4b3a6b">• 修复 32 位构建上可能的</text><text x="660" y="214" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#4b3a6b">  heap-buffer overflow</text><text x="660" y="240" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#4b3a6b">• 64 位构建不受该问题影响</text><text x="660" y="266" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#4b3a6b">• 修复 3.54.0 的其他用户反馈问题</text><text x="660" y="300" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">日期与条目来自官方 changes.html</text><text x="26" y="374" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">旧文把 3.53.0 写成 2026-06-01、把 3.54.0 写成“预计 10 月”，均已按官方发布说明更正。</text></svg>
