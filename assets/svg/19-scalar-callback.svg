<svg xmlns="http://www.w3.org/2000/svg" width="960" height="429" viewBox="0 0 960 429" role="img" aria-labelledby="func19a-title func19a-desc"><title id="func19a-title">SQLite 自定义标量函数的注册和执行生命周期</title><desc id="func19a-desc">sqlite3_create_function_v2 注册函数定义，prepare 解析名称参数，step 时由 VDBE 调用 xFunc，回调通过 sqlite3_result_* 写入 SQL 值。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="429" fill="#fbfcfa"/><text x="26" y="41" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">注册≠执行：prepare 找函数，step 时调用回调</text><rect x="27" y="94" width="209" height="94" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="131.5" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">create_function_v2</text><text x="131.5" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">注册名称与 flags</text><rect x="265" y="94" width="209" height="94" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="369.5" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">prepare</text><text x="369.5" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">解析 double_checked(x)</text><rect x="502" y="94" width="209" height="94" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="606.5" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">VDBE step</text><text x="606.5" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">调用 xFunc(ctx,...)</text><rect x="740" y="94" width="193" height="94" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="836.5" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">sqlite3_result_*</text><text x="836.5" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">返回 SQL 结果</text><path d="M236 142 L262 142" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M474 142 L499 142" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M711 142 L737 142" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect x="58" y="278" width="398" height="35" rx="16" fill="#e8f3ef" stroke="#167c7b" stroke-width=".8"/><text x="257" y="302" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5054">sqlite3_value_* 获取输入参数</text><rect x="506" y="278" width="397" height="35" rx="16" fill="#f8f3e4" stroke="#9b833c" stroke-width=".8"/><text x="704.5" y="302" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5054">xDestroy 管理 pApp 生命周期</text><text x="27" y="406" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#547075">SQLite 对值对象、context 的使用寿命有约束；不要返回指向临时栈内存的悬空指针。</text></svg>
