<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">FTS5 多段索引与合并</title><desc id="desc">每个提交事务可产生新的 segment B-tree；查询汇总多个 segment 的命中；automerge 在写事务中增量执行。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#c76743"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.label{font-size:18px;font-weight:700}.head{font-size:23px;font-weight:700}.box{fill:#fffdf9;stroke:#b9c9c5;stroke-width:2}.teal{fill:#e4f3ef;stroke:#147f80;stroke-width:2}.terra{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#f0edfb;stroke:#7461ba;stroke-width:2}.gold{fill:#fff6df;stroke:#b28a2e;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arr)}.line2{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arr2)}.dash{stroke:#916c22;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<text x="42" y="48" class="head">写入阶段：多个 segment B-tree</text>
<rect x="70" y="92" width="170" height="90" rx="13" class="teal"/><text x="155" y="128" text-anchor="middle" class="label">事务 A</text><text x="155" y="158" text-anchor="middle" class="small">S0 · level 0</text><rect x="276" y="92" width="170" height="90" rx="13" class="teal"/><text x="361" y="128" text-anchor="middle" class="label">事务 B</text><text x="361" y="158" text-anchor="middle" class="small">S1 · level 0</text><rect x="482" y="92" width="170" height="90" rx="13" class="teal"/><text x="567" y="128" text-anchor="middle" class="label">事务 C</text><text x="567" y="158" text-anchor="middle" class="small">S2 · level 0</text>
<path d="M155 182 V232 H360 V266" class="line"/><path d="M361 182 V266" class="line"/><path d="M567 182 V232 H360" class="line"/>
<rect x="260" y="268" width="200" height="78" rx="13" class="terra"/><text x="360" y="300" text-anchor="middle" class="label">Automerge</text><text x="360" y="326" text-anchor="middle" class="small">写路径上的增量合并</text>
<path d="M460 307 H586" class="line2"/><rect x="590" y="268" width="270" height="78" rx="13" class="violet"/><text x="725" y="300" text-anchor="middle" class="label">merged segment</text><text x="725" y="326" text-anchor="middle" class="small">减少查询要访问的段数</text>
<path d="M360 346 V392" class="dash"/><rect x="160" y="394" width="400" height="70" rx="13" class="gold"/><text x="360" y="424" text-anchor="middle" class="label">INSERT INTO ft(ft) VALUES('optimize')</text><text x="360" y="448" text-anchor="middle" class="small">全量整理；可能耗时</text>
<text x="610" y="418" class="small">不是后台常驻线程</text><text x="610" y="444" class="small">自动合并发生在写入路径</text></svg>