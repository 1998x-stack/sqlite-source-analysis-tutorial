<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">点命令属于 Shell，SQL 才进入 SQLite 引擎</title><desc id="desc">同一个输入流由 Shell 解析；dot commands 是 CLI 专用指令，SQL statements 交给 SQLite library。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#c76743"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.label{font-size:18px;font-weight:700}.head{font-size:23px;font-weight:700}.box{fill:#fffdf9;stroke:#b9c9c5;stroke-width:2}.teal{fill:#e4f3ef;stroke:#147f80;stroke-width:2}.terra{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#f0edfb;stroke:#7461ba;stroke-width:2}.gold{fill:#fff6df;stroke:#b28a2e;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arr)}.line2{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arr2)}.dash{stroke:#916c22;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<text x="54" y="52" class="head">输入：一行命令</text><rect x="52" y="78" width="856" height="72" rx="13" class="box"/><text x="90" y="122" class="label">.mode box</text><text x="500" y="122" class="label">SELECT name FROM users;</text>
<path d="M275 150 V220 H228 V266" class="line2"/><path d="M688 150 V220 H732 V266" class="line"/>
<rect x="54" y="270" width="350" height="112" rx="14" class="violet"/><text x="229" y="310" text-anchor="middle" class="label">CLI Shell 自己处理</text><text x="229" y="344" text-anchor="middle" class="small">改变输出模式、文件、计时器</text><text x="229" y="366" text-anchor="middle" class="small">不会作为 SQL 送进 prepare</text>
<rect x="556" y="270" width="350" height="112" rx="14" class="teal"/><text x="731" y="310" text-anchor="middle" class="label">SQLite library 执行</text><text x="731" y="344" text-anchor="middle" class="small">sqlite3_prepare_v2 → sqlite3_step</text><text x="731" y="366" text-anchor="middle" class="small">结果行由 Shell 接收并显示</text>
<text x="54" y="444" class="small">点命令通常必须位于输入行开头；不能把 .mode 当作 SQL 语句拼进 sqlite3_exec()。</text></svg>