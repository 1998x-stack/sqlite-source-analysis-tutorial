<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Stale expression index 的有限自修复路径</title><desc id="desc">跨平台或版本变化可能使表达式计算结果发生微小差异；DELETE 或 UPDATE 需要删除旧键时，SQLite 3.53+ 可尝试按主键定位并修复。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#c76743"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.label{font-size:18px;font-weight:700}.head{font-size:23px;font-weight:700}.box{fill:#fffdf9;stroke:#b9c9c5;stroke-width:2}.teal{fill:#e4f3ef;stroke:#147f80;stroke-width:2}.terra{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#f0edfb;stroke:#7461ba;stroke-width:2}.gold{fill:#fff6df;stroke:#b28a2e;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arr)}.line2{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arr2)}.dash{stroke:#916c22;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<rect x="42" y="84" width="240" height="104" rx="14" class="box"/><text x="162" y="122" text-anchor="middle" class="label">旧索引键</text><text x="162" y="154" text-anchor="middle" class="small">1.0000000000000002</text>
<rect x="42" y="220" width="240" height="104" rx="14" class="terra"/><text x="162" y="258" text-anchor="middle" class="label">新计算结果</text><text x="162" y="290" text-anchor="middle" class="small">1.0000000000000000</text>
<path d="M282 136 H356 V202 H416" class="line2"/><path d="M282 272 H356 V202" class="line2"/>
<rect x="420" y="144" width="220" height="116" rx="14" class="teal"/><text x="530" y="182" text-anchor="middle" class="label">UPDATE / DELETE</text><text x="530" y="214" text-anchor="middle" class="small">精确定位失败后</text><text x="530" y="238" text-anchor="middle" class="small">按主键字段寻找记录</text>
<path d="M640 202 H704" class="line"/><rect x="708" y="144" width="210" height="116" rx="14" class="violet"/><text x="813" y="184" text-anchor="middle" class="label">有限修复</text><text x="813" y="216" text-anchor="middle" class="small">不是通用 corruption 修复</text>
<rect x="78" y="382" width="350" height="84" rx="13" class="gold"/><text x="253" y="416" text-anchor="middle" class="label">PRAGMA integrity_check</text><text x="253" y="444" text-anchor="middle" class="small">仍可报告 imprecise floating-point</text>
<rect x="532" y="382" width="350" height="84" rx="13" class="teal"/><text x="707" y="416" text-anchor="middle" class="label">REINDEX EXPRESSIONS</text><text x="707" y="444" text-anchor="middle" class="small">显式重建所有表达式索引</text></svg>