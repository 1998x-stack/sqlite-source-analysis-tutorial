<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="ei22b-title ei22b-desc"><title id="ei22b-title">过期表达式索引与 3.53.0 的自修复路径</title><desc id="ei22b-desc">索引里存的表达式结果与重新计算结果相差一两个 ULP 时成为过期索引；3.53.0 起在更新或删除该行时自动修复，integrity_check 仍会报告不精确的浮点值。</desc><defs><marker id="ar22b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">“过期”不是逻辑错误，而是同一个确定性函数的结果漂移</text><rect x="26" y="76" width="270" height="104" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="1.8"/><text x="161" y="106" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#147f80">索引里存的键</text><text x="161" y="136" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" fill="#2c5054">0.3000000000000000</text><text x="161" y="162" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#537178">建索引时（旧平台/版本）</text><rect x="344" y="76" width="270" height="104" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="1.8"/><text x="479" y="106" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#8a4326">重新计算的键</text><text x="479" y="136" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" fill="#2c5054">0.2999999999999999</text><text x="479" y="162" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#537178">换架构/系统/版本后</text><text x="662" y="134" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" fill="#4d6d71">相差 1–2 ULP：</text><text x="662" y="160" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" fill="#4d6d71">同一函数、不同结果</text><path d="M296 128 L340 128" stroke="#79939b" stroke-width="2.2" fill="none" marker-end="url(#ar22b)"/><rect x="26" y="216" width="908" height="66" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="1.8"/><text x="44" y="246" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="700" fill="#4b3a6b">3.53.0（2026-04-09）起：DELETE / UPDATE 该行时自动修正索引，不再报错</text><text x="44" y="270" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#4b3a6b">PRAGMA integrity_check 仍会报告：index NAME stores an imprecise floating-point value for row N</text><rect x="26" y="304" width="908" height="62" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="1.4"/><text x="44" y="332" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" fill="#6b5a20">想彻底避开：改用 STORED 生成列再建普通索引；或 REINDEX EXPRESSIONS 只重建表达式索引。</text><text x="44" y="356" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#6b5a20">图中数值为示意，用于说明 ULP 级别差异，不对应某次具体运行。</text></svg>
