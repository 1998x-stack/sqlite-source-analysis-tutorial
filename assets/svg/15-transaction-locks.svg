<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v15c-title v15c-desc" viewBox="0 0 960 434" width="960" height="434"><title id="v15c-title">BEGIN DEFERRED IMMEDIATE 与 EXCLUSIVE 在回滚模式的取锁区别</title><desc id="v15c-desc">DEFERRED 开始时不立即开启读写事务，IMMEDIATE 立即请求写事务，EXCLUSIVE 在 rollback 模式下更严格地阻止其他读取；在 WAL 模式下 IMMEDIATE 与 EXCLUSIVE 基本等价。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="434" fill="#fbfcfa"/><text x="27" y="39" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">BEGIN 的三种模式不是“自动获得三种强锁”</text><rect x="25" y="104" width="272" height="96" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="161" y="134" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">DEFERRED</text><text x="161" y="162" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">直到需要时才尝试读 / 写</text><rect x="345" y="104" width="272" height="96" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="481" y="134" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">IMMEDIATE</text><text x="481" y="162" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">立即尝试开始写事务</text><rect x="664" y="104" width="272" height="96" rx="12" fill="#ffede4" stroke="#be6749" stroke-width="1.6"/><text x="800" y="134" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">EXCLUSIVE</text><text x="800" y="162" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">Rollback 模式下排除读者</text><rect x="47" y="282" width="247" height="34" rx="17" fill="#fff4dc"/><text x="170.5" y="305" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2d5659" font-weight="750" text-anchor="middle">读后升级写可能 BUSY</text><rect x="358" y="282" width="247" height="34" rx="17" fill="#fff4dc"/><text x="481.5" y="305" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2d5659" font-weight="750" text-anchor="middle">冲突可能在 BEGIN</text><rect x="675" y="282" width="247" height="34" rx="17" fill="#eee9f9"/><text x="798.5" y="305" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2d5659" font-weight="750" text-anchor="middle">WAL 模式差异需单独讲</text><path d="M161 202L161 279" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M481 202L481 279" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M801 202L801 279" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><text x="27" y="403" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#557275" font-weight="470" text-anchor="start">SQLite 同一数据库同时至多一个 writer；不同日志模式的读写并发与锁语义不同。</text></svg>
