<svg xmlns="http://www.w3.org/2000/svg" width="960" height="433" viewBox="0 0 960 433" role="img" aria-labelledby="wal16c-title wal16c-desc"><title id="wal16c-title">长读事务对 WAL checkpoint 的限制</title><desc id="wal16c-desc">Checkpoint 能把满足安全条件的 WAL 帧复制回主库，长读者仍持有旧 end mark 时可能限制 checkpoint 完成或 WAL 回收。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="433" fill="#fbfcfa"/><text x="27" y="39" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">Checkpoint 是受读者可见性约束的复制，而非立刻删除 WAL</text><rect x="33" y="90" width="264" height="96" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="165" y="119" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Writer</text><text x="165" y="146" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">继续 append frames</text><rect x="354" y="90" width="258" height="96" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="483" y="119" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">WAL frames</text><text x="483" y="146" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">事务提交后的版本</text><rect x="670" y="90" width="257" height="96" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="798.5" y="119" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Main database</text><text x="798.5" y="146" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">checkpoint 写回目标</text><path d="M297 136 L351 136" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M612 136 L667 136" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect x="104" y="266" width="343" height="91" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="275.5" y="295" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Reader R1 · 旧 end mark</text><text x="275.5" y="322" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">部分新帧仍不可覆盖 / 回收</text><rect x="558" y="266" width="309" height="91" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="2"/><text x="712.5" y="295" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Checkpoint progress</text><text x="712.5" y="322" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">busy/log/checkpointed 计数</text><path d="M232 189 L253 263" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M795 189 L717 263" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><text x="27" y="404" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#4f6f76">PASSIVE/FULL/RESTART/TRUNCATE 的等待与回收约束不同，观察 PRAGMA 实际返回值。</text></svg>
