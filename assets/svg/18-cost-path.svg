<svg xmlns="http://www.w3.org/2000/svg" width="960" height="433" viewBox="0 0 960 433" role="img" aria-labelledby="plan18b-title plan18b-desc"><title id="plan18b-title">NGQP 的 N3 保留多个部分路径进行搜索</title><desc id="plan18b-desc">不同 JOIN 前缀可具有不同访问代价；N3 在各阶段保留多个候选而不是只记录一个贪心最优；所绘成本不代表 SQLite 真实估计数值。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="433" fill="#fbfcfa"/><text x="28" y="42" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">候选前缀搜索：只看眼前最便宜并不总正确</text><rect x="29" y="100" width="258" height="93" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="158" y="129" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">起点：A 或 B</text><text x="158" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">不同起始扫描成本</text><rect x="350" y="100" width="258" height="93" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="479" y="129" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">N 条候选前缀</text><text x="479" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">保留多条路径</text><rect x="674" y="100" width="258" height="93" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="803" y="129" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">补上 JOIN 表</text><text x="803" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">更新估计成本</text><path d="M287 147 L348 147" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M608 147 L672 147" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect x="136" y="275" width="297" height="88" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="2"/><text x="284.5" y="304" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">A → B → C</text><text x="284.5" y="331" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">方案 P（示意）</text><rect x="526" y="275" width="297" height="88" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="674.5" y="304" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">B → A → C</text><text x="674.5" y="331" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">方案 Q（示意）</text><path d="M805 195 L680 271" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M805 195 L282 271" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><text x="28" y="404" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#587075">成本估计是 SQLite 内部模型，不可用表格中的虚构秒数冒充优化器输出。</text></svg>
