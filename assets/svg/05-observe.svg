<svg xmlns="http://www.w3.org/2000/svg" width="930" height="345" viewBox="0 0 930 345" role="img" aria-labelledby="t-05obs d-05obs"><title id="t-05obs">观察 lookaside 命中与失效</title><desc id="d-05obs">按每连接 sqlite3_db_status 中的 LOOKASIDE_HIT、MISS_SIZE 和 MISS_FULL 区分命中、申请过大和槽位耗尽。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#789395"/></marker></defs><rect width="930" height="345" fill="#f9fbf9"/><text x="35" y="42" text-anchor="start" fill="#23494d" font-size="20" font-weight="800" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">优化前先测量，而不是先调参数</text><rect x="26" y="102" width="256" height="93" rx="14" fill="#e3f2ec" stroke="#18847d" stroke-width="1.6"/><text x="154" y="133" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">LOOKASIDE_HIT</text><text x="154" y="160" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">请求被 lookaside 满足</text><rect x="337" y="102" width="256" height="93" rx="14" fill="#fff0e6" stroke="#c66b48" stroke-width="1.6"/><text x="465" y="133" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">MISS_SIZE</text><text x="465" y="160" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">尺寸不匹配</text><rect x="648" y="102" width="256" height="93" rx="14" fill="#ece9f7" stroke="#7763b5" stroke-width="1.6"/><text x="776" y="133" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">MISS_FULL</text><text x="776" y="160" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">可用槽位不足</text><path d="M154 196L154 256" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M465 196L465 256" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M776 196L776 256" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><text x="154" y="284" text-anchor="middle" fill="#243f43" font-size="17" font-weight="700" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">符合预期？</text><text x="465" y="284" text-anchor="middle" fill="#243f43" font-size="17" font-weight="700" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">调整对象大小？</text><text x="776" y="284" text-anchor="middle" fill="#243f43" font-size="17" font-weight="700" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">调整容量？</text><text x="28" y="327" text-anchor="start" fill="#597175" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">它们是计数器，不是自动计算的“命中率”；需要对总请求数和窗口定义做说明</text></svg>
