<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06a-title 06a-desc" viewBox="0 0 960 362" width="960" height="362"><title id="06a-title">SQLite 结果码与扩展结果码的层级关系</title><desc id="06a-desc">一次 UNIQUE 约束错误的基础类为 SQLITE_CONSTRAINT，扩展码可为 SQLITE_CONSTRAINT_UNIQUE。返回码应依据 API 和配置理解。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="362" fill="#f9fbf9"/><text x="30" y="38" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="21" font-weight="720">失败究竟属于哪一类？</text><rect x="40" y="94" width="255" height="89" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="167.5" y="124" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">SQLITE_CONSTRAINT</text><text x="167.5" y="151" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">基础结果码：19</text><rect x="355" y="94" width="255" height="89" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="482.5" y="124" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">SQLITE_CONSTRAINT_UNIQUE</text><text x="482.5" y="151" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">扩展细节：索引唯一性</text><rect x="670" y="94" width="255" height="89" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="797.5" y="124" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">sqlite3_errmsg()</text><text x="797.5" y="151" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">具体连接上的错误描述</text><path d="M295 138L350 138" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M610 138L665 138" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="80" y="239" width="290" height="31" rx="15" fill="#fff6df"/><text x="225" y="260" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">extended_code &amp; 0xff → 19</text><rect x="480" y="239" width="360" height="31" rx="15" fill="#eeebfa"/><text x="660" y="260" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">报告条件与 SQL 而非只报数字</text><text x="30" y="331" text-anchor="start" fill="#506e73" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="16" font-weight="460">SQLITE_ROW (100) / SQLITE_DONE (101) 是 step() 正常控制结果，不属于失败。</text></svg>
