<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v13a-title v13a-desc" viewBox="0 0 960 440" width="960" height="440"><title id="v13a-title">B-Tree 到 VFS 的页访问路径</title><desc id="v13a-desc">B-Tree 通过 Pager 请求页；PCache 判断缓存命中，未命中时读取；dirty page 写回需要满足事务和 journal/WAL 约束。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="440" fill="#fbfcfa"/><text x="26" y="42" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">“页缓存命中”与“事务已持久化”是两件事</text><rect x="28" y="96" width="202" height="91" rx="12" fill="#eee9f9" stroke="#705fb5" stroke-width="1.6"/><text x="129" y="126" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Btree</text><text x="129" y="154" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">逻辑键 / Record</text><rect x="276" y="96" width="202" height="91" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="377" y="126" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Pager</text><text x="377" y="154" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">事务 + 页面状态</text><rect x="524" y="96" width="202" height="91" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="625" y="126" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">PCache</text><text x="625" y="154" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">页在内存？</text><rect x="772" y="96" width="161" height="91" rx="12" fill="#ffede4" stroke="#be6749" stroke-width="1.6"/><text x="852.5" y="126" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">VFS</text><text x="852.5" y="154" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">I/O / sync</text><path d="M230 142L273 142" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M478 142L521 142" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M726 142L769 142" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" stroke-dasharray="6 5"/><rect x="151" y="279" width="262" height="83" rx="12" fill="#edf6df" stroke="#6c8c32" stroke-width="1.6"/><text x="282" y="309" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Hit</text><text x="282" y="337" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">返回已驻留页面</text><rect x="554" y="279" width="262" height="83" rx="12" fill="#fff4dc" stroke="#9b772e" stroke-width="1.6"/><text x="685" y="309" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Miss</text><text x="685" y="337" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">按需经 VFS 获取页面</text><path d="M625 189L281 275" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M625 189L685 275" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><text x="25" y="411" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#547279" font-weight="470" text-anchor="start">真正的同步顺序由 rollback journal/WAL、synchronous、锁及 VFS 能力共同决定。</text></svg>
