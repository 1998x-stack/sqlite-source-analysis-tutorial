<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="wa26b-title wa26b-desc"><title id="wa26b-title">按需求选择持久化 VFS</title><desc id="wa26b-desc">不需要持久化时用内存；需要持久化且要多标签页并发时用 opfs 或 opfs-wl；更看重性能或无法设置 COOP/COEP 响应头时用 opfs-sahpool。opfs-wl 在 3.53.0 加入并使用 Web Locks。</desc><defs><marker id="ar26b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">选哪种持久化 VFS，取决于并发与响应头</text><rect x="26" y="86" width="200" height="70" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="126" y="118" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#147f80">需要持久化？</text><text x="126" y="142" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#2c5054">刷新后还要保留数据</text><path d="M226 121 L300 121" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar26b)"/><text x="263" y="110" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#537178">否</text><rect x="304" y="86" width="230" height="70" rx="10" fill="#f8f3e4" stroke="#9b833c" stroke-width="1.8"/><text x="419" y="118" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#6b5a20">内存（如 :memory:）</text><text x="419" y="140" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#6b5a20">会话级，无需存储权限</text><path d="M126 156 L126 222" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar26b)"/><text x="140" y="196" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">是</text><rect x="26" y="226" width="230" height="130" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="1.8"/><text x="46" y="256" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" font-weight="700" fill="#4b3a6b">多标签页并发写入？</text><text x="46" y="284" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#4b3a6b">是 → opfs 或 opfs-wl</text><text x="46" y="308" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">opfs-wl 用 Web Locks，需</text><text x="46" y="328" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">Atomics.waitAsync()（3.53.0+）</text><text x="46" y="348" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">两者性能相当，无明确优胜者</text><rect x="330" y="226" width="360" height="130" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="1.8"/><text x="350" y="256" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" font-weight="700" fill="#8a4326">更看重性能，或无法设 COOP/COEP</text><text x="350" y="284" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">→ opfs-sahpool</text><text x="350" y="310" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">SyncAccessHandle 池；并发能力有限</text><text x="350" y="334" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">OPFS 只在 Worker 线程可用，</text><text x="350" y="352" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">主线程需经 Worker 或代理。</text><text x="716" y="292" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#4d6d71">还有其他会话级 KV 存储 VFS</text><text x="716" y="316" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#4d6d71">（kvvfs / JsStorageDb）</text><text x="26" y="384" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">选择依据来自官方 persistence 文档；浏览器支持度与性能会随版本变化。</text></svg>
