<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="t-05m d-05m"><title id="t-05m">SQLite 内存请求的不同作用域</title><desc id="d-05m">编译对象可以使用连接级 lookaside 或全局通用堆；数据库页由 Pager/PCache 管理；它们不是同一个缓存。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#789395"/></marker></defs><rect width="960" height="390" fill="#f9fbf9"/><text x="28" y="41" text-anchor="start" fill="#23494d" font-size="20" font-weight="800" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">一次 SQL 可能经历三种完全不同的“内存”</text><rect x="35" y="92" width="250" height="90" rx="14" fill="#e3f2ec" stroke="#18847d" stroke-width="1.6"/><text x="160" y="123" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">连接级小对象</text><text x="160" y="150" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Lookaside</text><rect x="355" y="92" width="250" height="90" rx="14" fill="#fff0e6" stroke="#c66b48" stroke-width="1.6"/><text x="480" y="123" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">通用动态分配</text><text x="480" y="150" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">sqlite3_malloc</text><rect x="675" y="92" width="250" height="90" rx="14" fill="#ece9f7" stroke="#7763b5" stroke-width="1.6"/><text x="800" y="123" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">数据库页缓存</text><text x="800" y="150" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Pager / PCache</text><path d="M160 184L160 250" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M481 184L481 250" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M800 184L800 250" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="45" y="263" width="230" height="70" rx="14" fill="#e3f2ec" stroke="#18847d" stroke-width="1.6"/><text x="160" y="294" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">适配、命中</text><text x="160" y="321" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">无额外通用分配</text><rect x="365" y="263" width="230" height="70" rx="14" fill="#fff0e6" stroke="#c66b48" stroke-width="1.6"/><text x="480" y="294" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">过大或池已用尽</text><text x="480" y="321" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">回退通用分配</text><rect x="685" y="263" width="230" height="70" rx="14" fill="#ece9f7" stroke="#7763b5" stroke-width="1.6"/><text x="800" y="294" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">缓存命中/缺页</text><text x="800" y="321" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">需要时读数据库页</text><text x="27" y="373" text-anchor="start" fill="#567277" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">区别：Lookaside 存放短生命周期分配；PCache 存放磁盘页。事务回滚另由 Pager/WAL 协同。</text></svg>
