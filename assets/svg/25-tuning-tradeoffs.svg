<rect x="280" y="288" width="400" height="100" rx="14" class="gold"/><text x="480" y="326" text-anchor="middle" class="head">记录配置 + 基准 + 正确性</text><text x="480" y="358" text-anchor="middle" class="small">source id · compile_options · OS · dataset</text>
<text x="48" y="444" class="small">不能把 synchronous=OFF、无限 cache 或 mmap 当通用加速开关。</text></svg>