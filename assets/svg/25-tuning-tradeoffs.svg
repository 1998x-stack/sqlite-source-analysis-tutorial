<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">PRAGMA 和编译选项都是带边界的工程取舍</title><desc id="desc">缓存、mmap、同步策略、页大小和编译功能分别影响内存、I/O、持久性和能力，必须按工作负载测量。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#c76743"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.label{font-size:18px;font-weight:700}.head{font-size:23px;font-weight:700}.box{fill:#fffdf9;stroke:#b9c9c5;stroke-width:2}.teal{fill:#e4f3ef;stroke:#147f80;stroke-width:2}.terra{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#f0edfb;stroke:#7461ba;stroke-width:2}.gold{fill:#fff6df;stroke:#b28a2e;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arr)}.line2{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arr2)}.dash{stroke:#916c22;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<rect x="46" y="80" width="260" height="112" rx="14" class="teal"/><text x="176" y="120" text-anchor="middle" class="label">统计信息</text><text x="176" y="152" text-anchor="middle" class="small">ANALYZE / PRAGMA optimize</text>
<rect x="350" y="80" width="260" height="112" rx="14" class="violet"/><text x="480" y="120" text-anchor="middle" class="label">内存与读取</text><text x="480" y="152" text-anchor="middle" class="small">cache_size / mmap_size</text>
<rect x="654" y="80" width="260" height="112" rx="14" class="terra"/><text x="784" y="120" text-anchor="middle" class="label">持久性</text><text x="784" y="152" text-anchor="middle" class="small">journal_mode / synchronous</text>
