<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">SQLite 3.54.0 的 CLI、Planner、API 与平台变化</title><desc id="svg-desc">3.54.0 对 CLI、查询规划、C API、SQL 函数和平台实现作出独立更新，3.54.1 修复部分 32 位构建问题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#147f80"/></marker><style>.bg{fill:#fffdf9}.teal{fill:#dff1eb;stroke:#147f80;stroke-width:2}.rust{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#eeeafd;stroke:#7161b5;stroke-width:2}.gold{fill:#fbf1d9;stroke:#a77b28;stroke-width:2}.head{font:700 29px system-ui,sans-serif;fill:#153438}.label{font:700 20px system-ui,sans-serif;fill:#203035}.small{font:16px system-ui,sans-serif;fill:#53676d}.tiny{font:14px system-ui,sans-serif;fill:#53676d}</style></defs><rect class="bg" width="1000" height="560" rx="22"/><text x="48" y="52" class="head">SQLite 3.54.0 的 CLI、Planner、API 与平台变化</text><rect x="55" y="95" width="420" height="165" rx="15" class="teal"/><text x="265" y="133" text-anchor="middle" class="label">CLI</text><text x="265" y="168" text-anchor="middle" class="small">SQLITE_PS1 / SQLITE_PS2 · NO_COLOR</text><text x="265" y="198" text-anchor="middle" class="small">.mode rowcount / titles / ifmt / fpfmt</text><text x="265" y="228" text-anchor="middle" class="small">diskused() · sqlite3_analyzer deprecated</text>
<rect x="525" y="95" width="420" height="165" rx="15" class="violet"/><text x="735" y="133" text-anchor="middle" class="label">Query Planner</text><text x="735" y="168" text-anchor="middle" class="small">Avoid no-op expression-index rewrites</text><text x="735" y="198" text-anchor="middle" class="small">OR TRUE/FALSE · IN DISTINCT</text><text x="735" y="228" text-anchor="middle" class="small">UNION LIMIT 1: faster, less memory</text>
<rect x="55" y="290" width="420" height="145" rx="15" class="gold"/><text x="265" y="328" text-anchor="middle" class="label">C API / SQL</text><text x="265" y="363" text-anchor="middle" class="small">sqlite3_result_str(sqlite3_str*, flags)</text><text x="265" y="393" text-anchor="middle" class="small">sqlite3_incomplete · %J / %j · date modifiers</text>
<rect x="525" y="290" width="420" height="145" rx="15" class="rust"/><text x="735" y="328" text-anchor="middle" class="label">Platform</text><text x="735" y="363" text-anchor="middle" class="small">Unix O_TMPFILE · Windows Vista+ only</text><text x="735" y="393" text-anchor="middle" class="small">Non-recursive mutex uses SRWLOCK</text>
<rect x="180" y="465" width="640" height="62" rx="13" class="rust"/><text x="500" y="490" text-anchor="middle" class="label">3.54.1 · 2026-10-16</text><text x="500" y="515" text-anchor="middle" class="small">修复部分 32-bit builds 的 heap-buffer overflow；64-bit 不受该问题影响</text></svg>