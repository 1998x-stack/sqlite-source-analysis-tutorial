<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v14a-title v14a-desc" viewBox="0 0 960 440" width="960" height="440"><title id="v14a-title">SQLite VFS 对象与文件方法表</title><desc id="v14a-desc">sqlite3_vfs 负责打开文件和平台服务；每个 sqlite3_file 对象带有 sqlite3_io_methods 指针，提供 xRead/xWrite/xSync/xLock 等。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="440" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">VFS 是两层接口：打开与文件方法</text><rect x="29" y="96" width="267" height="91" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="162.5" y="126" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">sqlite3_vfs</text><text x="162.5" y="154" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">xOpen / xDelete / xAccess</text><rect x="347" y="96" width="267" height="91" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="480.5" y="126" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">sqlite3_file</text><text x="480.5" y="154" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">当前打开的文件对象</text><rect x="665" y="96" width="267" height="91" rx="12" fill="#eee9f9" stroke="#705fb5" stroke-width="1.6"/><text x="798.5" y="126" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">sqlite3_io_methods</text><text x="798.5" y="154" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">xRead / xWrite / xSync</text><path d="M296 143L344 143" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M614 143L662 143" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><rect x="86" y="275" width="331" height="80" rx="12" fill="#edf6df" stroke="#6c8c32" stroke-width="1.6"/><text x="251.5" y="305" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Unix / Windows / 自定义 VFS</text><text x="251.5" y="333" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">同一 SQL，不同 OS 适配路径</text><rect x="553" y="275" width="331" height="80" rx="12" fill="#ffede4" stroke="#be6749" stroke-width="1.6"/><text x="718.5" y="305" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">依赖文件系统能力</text><text x="718.5" y="333" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">同步 / 锁 / sector 等约束</text><path d="M150 190L219 272" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M799 190L718 272" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><text x="28" y="410" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#557276" font-weight="470" text-anchor="start">sqlite3_vfs.xOpen 负责安装 file.pMethods；指针非 NULL 时失败清理也可能调用 xClose。</text></svg>
