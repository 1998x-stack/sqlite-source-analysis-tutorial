<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="t-05la d-05la"><title id="t-05la">双尺寸 Lookaside 机制决策图</title><desc id="d-05la">SQLite 3.31.0 起文档描述小 slot 与大 slot 双尺寸设计；可容纳请求时尝试空闲 slot，不匹配或耗尽时退回通用内存分配。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#789395"/></marker></defs><rect width="960" height="450" fill="#f9fbf9"/><text x="28" y="44" text-anchor="start" fill="#23494d" font-size="20" font-weight="800" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">小对象分配不是“固定 120 × 128 B”</text><rect x="359" y="80" width="240" height="78" rx="14" fill="#e7edef" stroke="#315c69" stroke-width="1.6"/><text x="479" y="111" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">内存请求 N bytes</text><text x="479" y="138" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">连接内存分配路径</text><path d="M480 160L480 204" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="359" y="209" width="240" height="75" rx="14" fill="#fff4d9" stroke="#ab7b25" stroke-width="1.6"/><text x="479" y="240" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">大小和空位判断</text><text x="479" y="267" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">版本相关策略</text><path d="M359 249L230 301" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M599 249L725 301" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="30" y="312" width="320" height="88" rx="14" fill="#e3f2ec" stroke="#18847d" stroke-width="1.6"/><text x="190" y="343" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">适配空闲 slot</text><text x="190" y="370" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">128 B 小槽 / 较大槽</text><rect x="610" y="312" width="320" height="88" rx="14" fill="#fff0e6" stroke="#c66b48" stroke-width="1.6"/><text x="770" y="343" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">槽位不匹配或耗尽</text><text x="770" y="370" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">走通用 allocator</text><text x="26" y="432" text-anchor="start" fill="#536d72" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">示意决策，不承诺每个 SQLite 版本的精确阈值与优先级；以官方 malloc.html 和所选版本源码为准</text></svg>
