<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v15b-title v15b-desc" viewBox="0 0 960 433" width="960" height="433"><title id="v15b-title">回滚日志崩溃后恢复判定</title><desc id="v15b-desc">重启后检查是否为有效 hot journal；存在有效 hot journal 则取得必要锁恢复旧页并清理，否则按现有一致状态继续；不是所有 journal 文件都等于 hot journal。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="433" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">崩溃后：journal 存在 ≠ 一定需要回滚</text><rect x="34" y="105" width="252" height="94" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="160" y="135" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">重新打开数据库</text><text x="160" y="163" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">检查 journal / locks</text><rect x="351" y="105" width="262" height="94" rx="12" fill="#fff4dc" stroke="#9b772e" stroke-width="1.6"/><text x="482" y="135" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">有效 hot journal?</text><text x="482" y="163" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">格式、状态、锁等条件</text><rect x="665" y="83" width="264" height="95" rx="12" fill="#ffede4" stroke="#be6749" stroke-width="1.6"/><text x="797" y="113" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">是 → 回放旧页</text><text x="797" y="141" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">锁定 / 恢复 / 同步</text><rect x="665" y="260" width="264" height="95" rx="12" fill="#edf6df" stroke="#6c8c32" stroke-width="1.6"/><text x="797" y="290" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">否 → 正常读取</text><text x="797" y="318" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">无需回放旧页</text><path d="M286 151L348 151" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M613 151L662 132" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M613 173L662 305" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><rect x="328" y="278" width="278" height="79" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="467" y="308" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">读取一致的数据库状态</text><text x="467" y="336" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">恢复后移除或失活 journal</text><path d="M795 180L522 275" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><text x="29" y="406" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5a7578" font-weight="470" text-anchor="start">恢复必须由 SQLite 在重新打开数据库时管理；不要手工删除潜在 hot journal。</text></svg>
