<svg xmlns="http://www.w3.org/2000/svg" width="930" height="360" viewBox="0 0 930 360" role="img" aria-labelledby="t-02f d-02f"><title id="t-02f">编译开关改变功能而非 SQL 语法本身</title><desc id="d-02f">同一合并版根据构建选项可生成默认构建、调试构建或经功能裁剪的构建；每种均应运行功能验证。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#789395"/></marker></defs><rect width="930" height="360" fill="#f9fbf9"/><text x="36" y="44" text-anchor="start" fill="#23494d" font-size="20" font-weight="800" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">同一份 sqlite3.c，为什么结果会不同？</text><rect x="353" y="72" width="220" height="70" rx="14" fill="#e7edef" stroke="#315c69" stroke-width="1.6"/><text x="463" y="103" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">sqlite3.c</text><text x="463" y="130" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">合并版输入</text><path d="M463 144L170 216" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M463 144L463 216" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M463 144L756 216" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="38" y="225" width="263" height="92" rx="14" fill="#e3f2ec" stroke="#18847d" stroke-width="1.6"/><text x="169.5" y="256" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">默认构建</text><text x="169.5" y="283" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">常规功能</text><rect x="333" y="225" width="263" height="92" rx="14" fill="#ece9f7" stroke="#7763b5" stroke-width="1.6"/><text x="464.5" y="256" text-anchor="middle" fill="#243f43" fon