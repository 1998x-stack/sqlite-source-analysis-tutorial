<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="pf25a-title pf25a-desc"><title id="pf25a-title">关键 PRAGMA 各自影响哪一层</title><desc id="pf25a-desc">cache_size 影响页缓存、mmap_size 影响内存映射 I/O、temp_store 决定临时对象位置、synchronous 决定提交时的同步次数、page_size 决定页粒度。</desc><defs><marker id="ar25a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">先用 EXPLAIN 看行为，再用 PRAGMA 调参数</text><rect x="26" y="80" width="250" height="80" rx="10" fill="#f4edf9" stroke="#8662a9" stroke-width="1.8"/><text x="151" y="112" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#4b3a6b">cache_size</text><text x="151" y="138" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#4b3a6b">页缓存的建议上限</text><rect x="26" y="176" width="250" height="80" rx="10" fill="#e8f3ef" stroke="#167c7b" stroke-width="1.8"/><text x="151" y="208" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#147f80">mmap_size</text><text x="151" y="234" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#2c5054">内存映射 I/O 上限（字节）</text><rect x="26" y="272" width="250" height="80" rx="10" fill="#f8f3e4" stroke="#9b833c" stroke-width="1.8"/><text x="151" y="304" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#6b5a20">temp_store</text><text x="151" y="330" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#6b5a20">临时对象放 FILE 还是 MEMORY</text><rect x="330" y="80" width="300" height="80" rx="10" fill="#ffefe5" stroke="#bc6b48" stroke-width="1.8"/><text x="480" y="112" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#8a4326">synchronous</text><text x="480" y="138" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#8a4326">OFF / NORMAL / FULL / EXTRA</text><rect x="330" y="176" width="300" height="80" rx="10" fill="#e8f3ef" stroke="#167c7b" stroke-width="1.8"/><text x="480" y="208" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#147f80">page_size</text><text x="480" y="234" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#2c5054">512–65536 的 2 的幕，创库时定</text><rect x="330" y="272" width="300" height="80" rx="10" fill="#f4edf9" stroke="#8662a9" stroke-width="1.8"/><text x="480" y="304" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#4b3a6b">wal_autocheckpoint</text><text x="480" y="330" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#4b3a6b">WAL 自动检查点阈值</text><path d="M276 120 L326 120" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar25a)"/><path d="M630 120 L700 190" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar25a)"/><rect x="704" y="150" width="230" height="230" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="819" y="182" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#3a4f7a">参数只是“建议/上限”</text><text x="720" y="214" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#3a4f7a">• cache_size 是否被采纳取决于</text><text x="720" y="236" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#3a4f7a">  页缓存实现（可被应用替换）</text><text x="720" y="264" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#3a4f7a">• synchronous=NORMAL 在 WAL 下</text><text x="720" y="286" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#3a4f7a">  不损坏但会丢已提交事务</text><text x="720" y="314" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#3a4f7a">• page_size 之后不可改，除非</text><text x="720" y="336" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#3a4f7a">  导出重建（VACUUM / dump）</text><text x="26" y="382" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">默认值与语义以官方 pragma.html 为准；不要把它当成跨版本不变量。</text></svg>
