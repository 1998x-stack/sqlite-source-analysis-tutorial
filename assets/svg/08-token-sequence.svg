<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="08a-title 08a-desc" viewBox="0 0 960 415" width="960" height="415"><title id="08a-title">SQLite tokenizer 将 SQL 字符流切为 token</title><desc id="08a-desc">示例 SELECT name FROM t WHERE id = ?; 按次分解为关键词、标识符、比较运算符与变量 token；空白作为词法空白处理。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="415" fill="#f9fbf9"/><text x="24" y="40" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="22" font-weight="720">字符输入：SELECT name FROM t WHERE id = ?;</text><rect x="25" y="91" width="145" height="90" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="97.5" y="121" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">SELECT</text><text x="97.5" y="148" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">关键字</text><rect x="190" y="91" width="145" height="90" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="262.5" y="121" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">name</text><text x="262.5" y="148" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">标识符</text><rect x="355" y="91" width="145" height="90" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="427.5" y="121" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">FROM</text><text x="427.5" y="148" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">关键字</text><rect x="520" y="91" width="145" height="90" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="592.5" y="121" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">t</text><text x="592.5" y="148" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">标识符</text><rect x="685" y="91" width="145" height="90" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="757.5" y="121" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">WHERE</text><text x="757.5" y="148" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">关键字</text><rect x="80" y="242" width="160" height="88" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="160" y="272" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">id</text><text x="160" y="299" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">标识符</text><rect x="294" y="242" width="160" height="88" rx="12" fill="#fff6df" stroke="#ab7b2c" stroke-width="1.6"/><text x="374" y="272" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">=</text><text x="374" y="299" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">比较运算符</text><rect x="507" y="242" width="160" height="88" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="587" y="272" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">?</text><text x="587" y="299" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">绑定参数</text><rect x="720" y="242" width="160" height="88" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="800" y="272" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">;</text><text x="800" y="299" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">结束符</text><text x="31" y="388" text-anchor="start" fill="#536e75" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="16" font-weight="460">空白和注释被词法阶段消耗；最后的 token 类型与语法角色必须区分。</text></svg>
