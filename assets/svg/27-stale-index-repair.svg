<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Stale expression index 的触发与修复范围</title><desc id="svg-desc">跨平台或版本变化使表达式计算得到略有差异的浮点索引键；3.53.0 在特定 UPDATE 或 DELETE 路径尝试自修复。</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#147f80"/></marker>
 <marker id="arrow-rust" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c76743"/></marker>
 <style>
 .bg{fill:#fffdf9}.teal{fill:#dff1eb;stroke:#147f80;stroke-width:2}.rust{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#eeeafd;stroke:#7161b5;stroke-width:2}.gold{fill:#fbf1d9;stroke:#a77b28;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arrow)}.line-r{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arrow-rust)}.dash{stroke:#8c9c98;stroke-width:2;stroke-dasharray:7 7;fill:none}.head{font:700 29px system-ui,sans-serif;fill:#153438}.label{font:700 21px system-ui,sans-serif;fill:#203035}.small{font:17px system-ui,sans-serif;fill:#53676d}.tiny{font:15px system-ui,sans-serif;fill:#53676d}
 </style>
</defs>
<rect class="bg" width="1000" height="560" rx="22"/>
<text x="48" y="52" class="head">Stale expression index 的触发与修复范围</text>
<rect x="55" y="120" width="235" height="110" rx="15" class="teal"/><text x="172" y="160" text-anchor="middle" class="label">旧环境</text><text x="172" y="190" text-anchor="middle" class="small">expr(row) → key A</text><path d="M290 175 H380" class="line"/><rect x="380" y="120" width="235" height="110" rx="15" class="gold"/><text x="497" y="160" text-anchor="middle" class="label">新环境</text><text x="497" y="190" text-anchor="middle" class="small">expr(row) → key A ± ULP</text><path d="M615 175 H705" class="line-r"/><rect x="705" y="120" width="240" height="110" rx="15" class="rust"/><text x="825" y="160" text-anchor="middle" class="label">索引键不一致</text><text x="825" y="190" text-anchor="middle" class="small">stale expression index</text><path d="M825 230 V300" class="line"/><rect x="625" y="300" width="320" height="110" rx="15" class="violet"/><text x="785" y="340" text-anchor="middle" class="label">UPDATE / DELETE</text><text x="785" y="372" text-anchor="middle" class="small">3.53+ 某些场景尝试修复</text><path d="M625 355 H500 V410" class="line"/><rect x="265" y="410" width="470" height="90" rx="15" class="teal"/><text x="500" y="447" text-anchor="middle" class="label">REINDEX EXPRESSIONS</text><text x="500" y="477" text-anchor="middle" class="small">显式重建全部表达式索引</text><text x="55" y="535" class="tiny">integrity_check 仍可能报告 imprecise floating-point value；这不是通用 corruption repair。</text>
</svg>