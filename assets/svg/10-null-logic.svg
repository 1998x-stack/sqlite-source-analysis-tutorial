<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="10b-title 10b-desc" viewBox="0 0 960 439" width="960" height="439"><title id="10b-title">NULL 参与 IN / NOT IN 的三值逻辑</title><desc id="10b-desc">5 IN (1, NULL) 没有匹配且右集合含 NULL，结果 UNKNOWN；5 NOT IN (1,NULL) 也不是 TRUE。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="439" fill="#f9fbf9"/><text x="28" y="40" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="21" font-weight="720">NULL 不等于“一个特殊的普通数值”</text><rect x="25" y="91" width="270" height="94" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="160" y="121" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">5 IN (1, NULL)</text><text x="160" y="148" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">结果 NULL（未知）</text><rect x="345" y="91" width="270" height="94" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="480" y="121" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">5 NOT IN (1, NULL)</text><text x="480" y="148" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">结果 NULL（未知）</text><rect x="665" y="91" width="270" height="94" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="800" y="121" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">5 IN (1, 5)</text><text x="800" y="148" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">结果 1（真）</text><rect x="85" y="252" width="350" height="94" rx="12" fill="#fff6df" stroke="#ab7b2c" stroke-width="1.6"/><text x="260" y="282" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">CASE WHEN NULL ...</text><text x="260" y="309" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">WHEN 未判真，走 ELSE</text><rect x="516" y="252" width="350" height="94" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="691" y="282" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">WHERE 谓词 = NULL</text><text x="691" y="309" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">不会保留该行</text><text x="28" y="407" text-anchor="start" fill="#597176" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">上图对比“未知”和“假”；IN / NOT IN 对空集合还存在特殊规则，参见官方语言文档。</text></svg>
