<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">把完整事务放进一个 Worker 任务</title><desc id="svg-desc">UI 主线程发送一个任务消息，Worker 在单一受控任务中完成 BEGIN、SQL、COMMIT，错误时 ROLLBACK 后返回。</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#147f80"/></marker>
 <marker id="arrow-rust" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c76743"/></marker>
 <style>
 .bg{fill:#fffdf9}.teal{fill:#dff1eb;stroke:#147f80;stroke-width:2}.rust{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#eeeafd;stroke:#7161b5;stroke-width:2}.gold{fill:#fbf1d9;stroke:#a77b28;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arrow)}.line-r{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arrow-rust)}.dash{stroke:#8c9c98;stroke-width:2;stroke-dasharray:7 7;fill:none}.head{font:700 29px system-ui,sans-serif;fill:#153438}.label{font:700 21px system-ui,sans-serif;fill:#203035}.small{font:17px system-ui,sans-serif;fill:#53676d}.tiny{font:15px system-ui,sans-serif;fill:#53676d}
 </style>
</defs>
<rect class="bg" width="1000" height="560" rx="22"/>
<text x="48" y="52" class="head">把完整事务放进一个 Worker 任务</text>
<rect x="55" y="110" width="245" height="360" rx="18" class="teal"/><text x="177" y="150" text-anchor="middle" class="label">UI 主线程</text><text x="177" y="183" text-anchor="middle" class="small">保持交互与绘制</text><rect x="92" y="230" width="170" height="72" rx="12" class="gold"/><text x="177" y="260" text-anchor="middle" class="label">postMessage</text><text x="177" y="284" text-anchor="middle" class="tiny">{ type: 'run' }</text><rect x="92" y="355" width="170" height="72" rx="12" class="violet"/><text x="177" y="385" text-anchor="middle" class="label">render(result)</text><text x="177" y="409" text-anchor="middle" class="tiny">错误也结构化返回</text>
<rect x="700" y="110" width="245" height="360" rx="18" class="rust"/><text x="822" y="150" text-anchor="middle" class="label">SQLite Worker</text><text x="822" y="183" text-anchor="middle" class="small">初始化与 SQL 同线程</text><rect x="735" y="220" width="175" height="58" rx="10" class="gold"/><text x="822" y="256" text-anchor="middle" class="label">BEGIN</text><rect x="735" y="300" width="175" height="58" rx="10" class="teal"/><text x="822" y="336" text-anchor="middle" class="label">SQL + bind</text><rect x="735" y="380" width="175" height="58" rx="10" class="violet"/><text x="822" y="416" text-anchor="middle" class="label">COMMIT</text>
<path d="M300 266 H690" class="line"/><text x="495" y="246" text-anchor="middle" class="small">请求消息</text><path d="M822 278 V293" class="line"/><path d="M822 358 V373" class="line"/><path d="M735 410 H655 V330 H690" class="line-r"/><text x="655" y="310" text-anchor="end" class="tiny">异常 → ROLLBACK</text><path d="M700 414 H620 V390 H310" class="line"/><text x="500" y="374" text-anchor="middle" class="small">响应消息</text><text x="500" y="520" text-anchor="middle" class="label">不要把 BEGIN / SQL / COMMIT 拆成可交错的多条消息</text>
</svg>