<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">性能优化必须形成可重复的测量闭环</title><desc id="desc">先固定工作负载和环境，再观察计划与语句计数器；一次只改一个变量，最后复核结果正确性和重复测量。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#c76743"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.label{font-size:18px;font-weight:700}.head{font-size:23px;font-weight:700}.box{fill:#fffdf9;stroke:#b9c9c5;stroke-width:2}.teal{fill:#e4f3ef;stroke:#147f80;stroke-width:2}.terra{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#f0edfb;stroke:#7461ba;stroke-width:2}.gold{fill:#fff6df;stroke:#b28a2e;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arr)}.line2{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arr2)}.dash{stroke:#916c22;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<rect x="50" y="100" width="190" height="112" rx="14" class="box"/><text x="70" y="132" class="small">01</text><text x="145" y="162" text-anchor="middle" class="label">定义工作负载</text><text x="145" y="188" text-anchor="middle" class="small">数据量 / 参数 / 并发</text><rect x="270" y="100" width="190" height="112" rx="14" class="teal"/><text x="290" y="132" class="small">02</text><text x="365" y="162" text-anchor="middle" class="label">建立基线</text><text x="365" y="188" text-anchor="middle" class="small">耗时 / VM steps / IO</text><rect x="490" y="100" width="190" height="112" rx="14" class="violet"/><text x="510" y="132" class="small">03</text><text x="585" y="162" text-anchor="middle" class="label">解释计划</text><text x="585" y="188" text-anchor="middle" class="small">SCAN / SEARCH / SORT</text><rect x="710" y="100" width="190" height="112" rx="14" class="terra"/><text x="730" y="132" class="small">04</text><text x="805" y="162" text-anchor="middle" class="label">选择单一改动</text><text x="805" y="188" text-anchor="middle" class="small">索引 / 统计 / PRAGMA</text>
