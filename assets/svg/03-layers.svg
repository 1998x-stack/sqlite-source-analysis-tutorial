<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="t-03l d-03l"><title id="t-03l">SQLite 主要处理层与典型源码文件</title><desc id="d-03l">左侧自上而下是 SQL 编译链，右侧延续字节码执行与存储层；箭头为主路径，不代表所有分支都会触及文件 I/O。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#789395"/></marker></defs><rect width="960" height="490" fill="#f9fbf9"/><text x="35" y="40" text-anchor="start" fill="#23494d" font-size="20" font-weight="800" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">上层是编译器，下层是存储引擎</text><rect x="36" y="86" width="190" height="78" rx="14" fill="#e7edef" stroke="#315c69" stroke-width="1.6"/><text x="131" y="117" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">SQL / API</text><text x="131" y="144" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">main.c · vdbeapi.c</text><rect x="280" y="86" width="190" height="78" rx="14" fill="#e3f2ec" stroke="#18847d" stroke-width="1.6"/><text x="375" y="117" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Tokenizer / Parser</text><text x="375" y="144" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">tokenize.c · parse.y</text><rect x="525" y="86" width="190" height="78" rx="14" fill="#fff0e6" stroke="#c66b48" stroke-width="1.6"/><text x="620" y="117" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Code generator</text><text x="620" y="144" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei'