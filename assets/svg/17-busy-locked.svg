<svg xmlns="http://www.w3.org/2000/svg" width="960" height="431" viewBox="0 0 960 431" role="img" aria-labelledby="lock17c-title lock17c-desc"><title id="lock17c-title">SQLITE_BUSY 与 SQLITE_LOCKED 的边界</title><desc id="lock17c-desc">不同连接争用同一数据库文件写资源典型返回 SQLITE_BUSY；同连接或共享缓存表级锁冲突可能 SQLITE_LOCKED，需查询扩展码和场景。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="431" fill="#fbfcfa"/><text x="27" y="42" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">同样是“锁”，错误的所有权与恢复策略不同</text><rect x="33" y="98" width="398" height="94" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="232" y="127" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">SQLITE_BUSY</text><text x="232" y="154" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">其它连接/进程持有冲突锁</text><rect x="532" y="98" width="395" height="94" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="729.5" y="127" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">SQLITE_LOCKED</text><text x="729.5" y="154" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">共享缓存或同连接对象冲突</text><rect x="84" y="271" width="302" height="86" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="2"/><text x="235" y="300" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">busy_timeout / 重试</text><text x="235" y="327" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">有条件等待锁释放</text><rect x="581" y="271" width="302" height="86" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="732" y="300" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">修正语句或资源顺序</text><text x="732" y="327" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">不是一律 sleep 即可</text><path d="M231 195 L231 268" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M727 195 L727 268" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><text x="30" y="404" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#4c6c76">SQLITE_BUSY_SNAPSHOT 是 BUSY 的扩展码，表示旧快照不能直接升级成 writer。</text></svg>
