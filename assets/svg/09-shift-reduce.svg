<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="09b-title 09b-desc" viewBox="0 0 960 397" width="960" height="397"><title id="09b-title">Shift Reduce 的推演时间轴</title><desc id="09b-desc">玩具文法 term ::= NUM、expr ::= expr PLUS term 或 term；读 1 + 2 后按 shift 和 reduce 规则完成表达式归约，非 SQLite 的真实堆栈快照。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="397" fill="#f9fbf9"/><text x="28" y="39" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="20" font-weight="720">玩具文法：expr → expr + term | term；term → NUM</text><rect x="22" y="99" width="173" height="93" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="108.5" y="129" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">① shift</text><text x="108.5" y="156" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">读入 NUM(1)</text><rect x="214" y="99" width="173" height="93" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="300.5" y="129" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">② reduce</text><text x="300.5" y="156" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">NUM → term → expr</text><rect x="407" y="99" width="173" height="93" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="493.5" y="129" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">③ shift</text><text x="493.5" y="156" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">PLUS, NUM(2)</text><rect x="600" y="99" width="173" height="93" rx="12" fill="#fff6df" stroke="#ab7b2c" stroke-width="1.6"/><text x="686.5" y="129" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">④ reduce</text><text x="686.5" y="156" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">NUM → term</text><rect x="791" y="99" width="146" height="93" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="864" y="129" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">⑤ reduce</text><text x="864" y="156" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">expr+term</text><path d="M195 145L211 145" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M387 145L404 145" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M580 145L597 145" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M773 145L788 145" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="37" y="270" width="400" height="31" rx="15" fill="#e9f0f3"/><text x="237" y="291" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">shift：追加语法符号与状态</text><rect x="520" y="270" width="400" height="31" rx="15" fill="#e6f4ef"/><text x="720" y="291" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">reduce：按文法规则压缩栈顶</text><text x="31" y="363" text-anchor="start" fill="#5a7277" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">这是帮助理解 parser 动作的简化推演，真实 SQLite parser 的状态编号和规约顺序以生成表为准。</text></svg>
