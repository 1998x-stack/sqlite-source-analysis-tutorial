<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v14b-title v14b-desc" viewBox="0 0 960 424" width="960" height="424"><title id="v14b-title">从 SQL 到 VFS xRead 的一次可能路径</title><desc id="v14b-desc">磁盘读取需要 Btree 从 Pager 获取缓存未命中页，Pager 触发 sqlite3_file 的 xRead；缓存命中可跳过 xRead，事务提交可能触发 xWrite 与 xSync。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="424" fill="#fbfcfa"/><text x="26" y="41" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">同一 SELECT 不保证出现 xRead</text><rect x="27" y="102" width="188" height="88" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="121" y="132" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">SELECT</text><text x="121" y="160" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">step 中读页</text><rect x="260" y="102" width="188" height="88" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="354" y="132" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Pager</text><text x="354" y="160" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">请求 page N</text><rect x="493" y="102" width="188" height="88" rx="12" fill="#fff4dc" stroke="#9b772e" stroke-width="1.6"/><text x="587" y="132" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Cache hit?</text><text x="587" y="160" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">条件判断</text><rect x="728" y="102" width="204" height="88" rx="12" fill="#ffede4" stroke="#be6749" stroke-width="1.6"/><text x="830" y="132" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">VFS xRead</text><text x="830" y="160" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">仅缺页时读取</text><path d="M215 147L257 147" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M448 147L490 147" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M681 147L725 147" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><rect x="345" y="272" width="270" height="82" rx="12" fill="#edf6df" stroke="#6c8c32" stroke-width="1.6"/><text x="480" y="302" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Hit</text><text x="480" y="330" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">绕过本次 xRead</text><path d="M586 193L480 269" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><text x="27" y="398" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#537079" font-weight="470" text-anchor="start">提交写事务时，xWrite 与 xSync 的顺序由 journal mode / synchronous 配置约束。</text></svg>
