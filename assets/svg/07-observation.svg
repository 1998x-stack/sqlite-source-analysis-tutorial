<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07a-title 07a-desc" viewBox="0 0 960 380" width="960" height="380"><title id="07a-title">从 SQL 结果到运行时调试的四层观察路径</title><desc id="07a-desc">SQL 结果回答是什么，EQP 回答访问计划，EXPLAIN 回答 VDBE 字节码，调试编译追踪指令生成与执行；应分别理解。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="380" fill="#f9fbf9"/><text x="30" y="39" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="21" font-weight="720">看得到的层次 ≠ 代码中实际的全部状态</text><rect x="34" y="94" width="195" height="98" rx="12" fill="#eaf5e8" stroke="#3c8466" stroke-width="1.6"/><text x="131.5" y="124" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">SQL 结果</text><text x="131.5" y="151" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">正确性</text><rect x="267" y="94" width="195" height="98" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="364.5" y="124" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">EXPLAIN QUERY PLAN</text><text x="364.5" y="151" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">访问策略</text><rect x="499" y="94" width="195" height="98" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="596.5" y="124" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">EXPLAIN</text><text x="596.5" y="151" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">字节码程序</text><rect x="733" y="94" width="195" height="98" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="830.5" y="124" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">调试 Trace</text><text x="830.5" y="151" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">生成 / 执行时刻</text><path d="M229 146L264 146" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M462 146L496 146" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M694 146L730 146" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="60" y="251" width="355" height="31" rx="15" fill="#e9f0f3"/><text x="237.5" y="272" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">从外部观察；默认构建可使用</text><rect x="529" y="251" width="360" height="31" rx="15" fill="#fff6df"/><text x="709" y="272" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">调试宏/CLI 组合决定可用性</text><text x="31" y="340" text-anchor="start" fill="#506f76" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">计划展示是摘要，EXPLAIN 不是高层性能报告；版本变化时不比较固定 opcode 行号。</text></svg>
