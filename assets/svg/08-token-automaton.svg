<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="08b-title 08b-desc" viewBox="0 0 960 420" width="960" height="420"><title id="08b-title">Token 扫描器的局部状态机</title><desc id="08b-desc">遇到标识符首字符扫描直到分隔符；遇到单引号字符串则匹配结尾的单引号并把双单引号视为转义，未闭合是非法词法输入。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="420" fill="#f9fbf9"/><text x="26" y="42" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="20" font-weight="720">两条不同的扫描路径：标识符与单引号字符串</text><rect x="29" y="95" width="196" height="78" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="127" y="125" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">首字符分派</text><text x="127" y="152" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">sqlite3GetToken</text><rect x="282" y="95" width="208" height="78" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="386" y="125" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">字母 / 下划线</text><text x="386" y="152" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">标识符扫描</text><rect x="551" y="95" width="208" height="78" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="655" y="125" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">单引号 '</text><text x="655" y="152" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">字符串扫描</text><path d="M225 132L279 132" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M225 162L553 162" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="282" y="255" width="208" height="78" rx="12" fill="#eaf5e8" stroke="#3c8466" stroke-width="1.6"/><text x="386" y="285" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">遇分隔符停止</text><text x="386" y="312" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">keyword lookup 或 ID</text><rect x="551" y="255" width="208" height="78" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="655" y="285" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">遇到匹配终止引号</text><text x="655" y="312" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">处理 '' 两字符转义</text><path d="M385 176L385 252" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M654 176L654 252" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="762" y="255" width="170" height="78" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="847" y="285" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">未闭合</text><text x="847" y="312" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">TK_ILLEGAL 路径</text><path d="M759 155L842 252" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><text x="27" y="386" text-anchor="start" fill="#5d7377" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">这是一幅扫描规则示意，并非 tokenize.c 的逐 case 状态图，路径条件以对应版本源码为准。</text></svg>
