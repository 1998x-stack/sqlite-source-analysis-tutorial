<svg xmlns="http://www.w3.org/2000/svg" width="960" height="434" viewBox="0 0 960 434" role="img" aria-labelledby="vtab20a-title vtab20a-desc"><title id="vtab20a-title">xBestIndex 与 xFilter 的约束协商过程</title><desc id="vtab20a-desc">Planner 将 WHERE 条件送给 xBestIndex，module 写出 argvIndex、idxNum/idxStr、estimatedCost 等方案，运行时 xFilter 接收指定参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="434" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">xBestIndex 制定计划，xFilter 按计划接受参数</text><rect x="31" y="94" width="271" height="96" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="166.5" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">WHERE id = ?1</text><text x="166.5" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">Planner 提供 constraints</text><rect x="347" y="94" width="271" height="96" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="482.5" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">xBestIndex(info)</text><text x="482.5" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">选择 argvIndex=1</text><rect x="664" y="94" width="269" height="96" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="798.5" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">xFilter(idxNum,argv)</text><text x="798.5" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">定位实际游标</text><path d="M302 142 L344 142" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M618 142 L661 142" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect x="111" y="279" width="313" height="85" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="2"/><text x="267.5" y="308" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">估计成本 / 行数</text><text x="267.5" y="335" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">这是建议，不是查询执行结果</text><rect x="537" y="279" width="313" height="85" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="693.5" y="308" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">xNext / xColumn / xEof</text><text x="693.5" y="335" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">逐行向 VDBE 提供结果</text><path d="M486 192 L272 276" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M797 192 L694 276" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><text x="26" y="410" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#547177">omit=1 只对被正确处理的约束设置；否则可能改变 WHERE 语义。</text></svg>
