<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v11b-title v11b-desc" viewBox="0 0 960 420" width="960" height="420"><title id="v11b-title">三个寄存器的教学追踪表</title><desc id="v11b-desc">演示 Integer 常量进入寄存器，算术计算写入结果寄存器，ResultRow 读取结果，不宣称是 EXPLAIN 的真实地址编号。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="420" fill="#fbfcfa"/><text x="30" y="42" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">最小抽象机：执行每条指令后，寄存器发生什么变化？</text><rect x="30" y="90" width="221" height="53" fill="#e7f2ef" stroke="#cadad4" /><text x="140" y="123" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#1f5a5b" font-weight="750" text-anchor="middle">指令（教学模型）</text><rect x="254" y="90" width="217" height="53" fill="#e7f2ef" stroke="#cadad4" /><text x="362" y="123" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#1f5a5b" font-weight="750" text-anchor="middle">r1</text><rect x="478" y="90" width="217" height="53" fill="#e7f2ef" stroke="#cadad4" /><text x="586" y="123" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#1f5a5b" font-weight="750" text-anchor="middle">r2</text><rect x="702" y="90" width="217" height="53" fill="#e7f2ef" stroke="#cadad4" /><text x="810" y="123" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#1f5a5b" font-weight="750" text-anchor="middle">r3</text><rect x="30" y="145" width="221" height="53" fill="#ffffff" stroke="#cadad4" /><text x="140" y="178" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#2b484b" font-weight="750" text-anchor="middle">LoadInt 2 → r1</text><rect x="254" y="145" width="217" height="53" fill="#ffffff" stroke="#cadad4" /><text x="362" y="178