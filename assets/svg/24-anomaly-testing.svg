<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">异常测试把失败注入到资源边界</title><desc id="desc">测试框架在可控位置注入内存分配失败、VFS I/O 错误或进程崩溃，再检查事务原子性和数据库完整性。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#c76743"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.label{font-size:18px;font-weight:700}.head{font-size:23px;font-weight:700}.box{fill:#fffdf9;stroke:#b9c9c5;stroke-width:2}.teal{fill:#e4f3ef;stroke:#147f80;stroke-width:2}.terra{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#f0edfb;stroke:#7461ba;stroke-width:2}.gold{fill:#fff6df;stroke:#b28a2e;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arr)}.line2{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arr2)}.dash{stroke:#916c22;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<rect x="44" y="86" width="220" height="110" rx="14" class="gold"/><text x="154" y="126" text-anchor="middle" class="label">故障注入点</text><text x="154" y="158" text-anchor="middle" class="small">OOM / I/O / crash</text>
<path d="M264 142 H338" class="line2"/><rect x="342" y="86" width="270" height="110" rx="14" class="terra"/><text x="477" y="126" text-anchor="middle" class="label">事务操作执行中</text><text x="477" y="158" text-anchor="middle" class="small">pager / VFS / allocator</text>
<path d="M612 142 H686" class="line"/><rect x="690" y="86" width="220" height="110" rx="14" class="teal"/><text x="800" y="126" text-anchor="middle" class="label">重新打开数据库</text><text x="800" y="158" text-anchor="middle" class="small">恢复与错误传播</text>
<path d="M800 196 V270" class="line"/><rect x="342" y="272" width="568" height="104" rx="14" class="violet"/><text x="626" y="314" text-anchor="middle" class="label">PRAGMA integrity_check</text><text x="626" y="346" text-anchor="middle" class="small">确认数据库结构一致，事务要么完成要么回滚</text>
<rect x="44" y="272" width="220" height="104" rx="14" class="box"/><text x="154" y="314" text-anchor="middle" class="label">失败位置 + 1</text><text x="154" y="346" text-anchor="middle" class="small">循环覆盖下一分配 / I/O 步</text>
<path d="M154 272 V232 H477 V196" class="dash"/></svg>