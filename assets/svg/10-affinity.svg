<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="10c-title 10c-desc" viewBox="0 0 960 412" width="960" height="412"><title id="10c-title">SQLite 列亲和性与 CAST 的两个转换路径</title><desc id="10c-desc">列亲和性尝试按规则转换再比较，而 CAST 是显式转换且可能有损；value 的 storage class 与 column affinity 不是同一概念。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="412" fill="#f9fbf9"/><text x="24" y="40" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="20" font-weight="720">存储类型 / 列 affinity / 显式 CAST，不能互相替代</text><rect x="30" y="93" width="255" height="96" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="157.5" y="123" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">原始值 '42'</text><text x="157.5" y="150" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">TEXT storage class</text><rect x="351" y="93" width="255" height="96" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="478.5" y="123" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">INTEGER affinity 列</text><text x="478.5" y="150" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">在比较/存储规则中可转换</text><rect x="672" y="93" width="255" height="96" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="799.5" y="123" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">CAST('42' AS INTEGER)</text><text x="799.5" y="150" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">显式得到 INTEGER</text><path d="M285 140L348 140" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M606 140L669 140" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="43" y="259" width="388" height="31" rx="15" fill="#fff6df"/><text x="237" y="280" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">应用 affinity：只在规则允许时转换</text><rect x="528" y="259" width="383" height="31" rx="15" fill="#eeebfa"/><text x="719.5" y="280" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">CAST：有损转换也会尝试</text><text x="24" y="344" text-anchor="start" fill="#557079" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">例：SELECT typeof('42'), typeof(CAST('42' AS INTEGER)); → text, integer</text><text x="24" y="380" text-anchor="start" fill="#557079" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">关键区别：比较时的 affinity 不等同于 SELECT 表达式结果的存储类型。</text></svg>
