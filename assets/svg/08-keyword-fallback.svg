<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="08c-title 08c-desc" viewBox="0 0 960 422" width="960" height="422"><title id="08c-title">关键词识别与语法 fallback 是两个独立时机</title><desc id="08c-desc">tokenizer 识别拼写对应关键字 token；parser 依据当前状态决定是否使用受允的 fallback 到 ID；不是所有关键字都能当作列名。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="422" fill="#f9fbf9"/><text x="25" y="40" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="21" font-weight="720">识别单词 ≠ 决定它最终能否当标识符</text><rect x="37" y="95" width="250" height="85" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="162" y="125" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">词法扫描</text><text x="162" y="152" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">SQLite keyword lookup</text><rect x="355" y="95" width="250" height="85" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="480" y="125" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">token 类型</text><text x="480" y="152" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">关键字或 TK_ID</text><rect x="673" y="95" width="250" height="85" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="798" y="125" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">Lemon parser 状态</text><text x="798" y="152" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">当前语法位置</text><path d="M287 138L352 138" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M605 138L670 138" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="390" y="254" width="260" height="86" rx="12" fill="#fff6df" stroke="#ab7b2c" stroke-width="1.6"/><text x="520" y="284" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">允许 fallback?</text><text x="520" y="311" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">有限的 token 集合</text><path d="M800 183L520 251" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="55" y="281" width="240" height="31" rx="15" fill="#eaf5e8"/><text x="175" y="302" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">允许：按 ID 解释</text><rect x="668" y="281" width="244" height="31" rx="15" fill="#fff0e8"/><text x="790" y="302" text-anchor="middle" fill="#34575d" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="720">不允许：语法错误</text><path d="M390 297L299 297" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M650 297L666 297" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><text x="28" y="390" text-anchor="start" fill="#567276" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">是否允许 fallback 由 parse.y 的声明和解析状态决定；不能概括为“SQL 关键词都能作表名”。</text></svg>
