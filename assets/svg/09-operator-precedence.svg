<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="09c-title 09c-desc" viewBox="0 0 960 465" width="960" height="465"><title id="09c-title">1+2*3 的语法树及表达式优先级</title><desc id="09c-desc">乘法绑定比加法更紧，因此根节点为加法，右子树为乘法；示例采用算术 SQL 表达式的简化树。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769495"/></marker></defs><rect width="960" height="465" fill="#f9fbf9"/><text x="28" y="39" text-anchor="start" fill="#214247" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="21" font-weight="720">为什么 1 + 2 * 3 = 7，而不是 9？</text><rect x="369" y="73" width="224" height="77" rx="12" fill="#fff0e8" stroke="#c76743" stroke-width="1.6"/><text x="481" y="103" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">+</text><text x="481" y="130" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">根节点：加法</text><rect x="190" y="221" width="224" height="81" rx="12" fill="#e6f4ef" stroke="#147f80" stroke-width="1.6"/><text x="302" y="251" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">1</text><text x="302" y="278" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">左侧字面量</text><rect x="540" y="221" width="224" height="81" rx="12" fill="#eeebfa" stroke="#7161b5" stroke-width="1.6"/><text x="652" y="251" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">*</text><text x="652" y="278" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">先计算乘法</text><path d="M426 153L311 218" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M533 153L658 218" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="465" y="333" width="140" height="66" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="535" y="363" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">2</text><text x="535" y="390" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">数值</text><rect x="701" y="333" width="140" height="66" rx="12" fill="#e9f0f3" stroke="#466f80" stroke-width="1.6"/><text x="771" y="363" text-anchor="middle" fill="#213c43" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="18" font-weight="720">3</text><text x="771" y="390" text-anchor="middle" fill="#587177" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="14" font-weight="460">数值</text><path d="M607 305L533 330" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M702 305L771 330" fill="none" stroke="#769495" stroke-width="2.2" marker-end="url(#arrow)" /><text x="29" y="433" text-anchor="start" fill="#586f75" font-family="system-ui, -apple-system,'PingFang SC','Microsoft YaHei', sans-serif" font-size="15" font-weight="460">这表达的是优先级后的树形语义，不是源码内部 Expr 结构体的精确内存布局。</text></svg>
