<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">覆盖率、逻辑等价与模糊测试是不同维度</title><desc id="desc">Branch coverage、MC/DC、SQL 结果对比和 fuzz mutation 检查不同缺陷类别，不能用单一百分比替代。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#c76743"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.label{font-size:18px;font-weight:700}.head{font-size:23px;font-weight:700}.box{fill:#fffdf9;stroke:#b9c9c5;stroke-width:2}.teal{fill:#e4f3ef;stroke:#147f80;stroke-width:2}.terra{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#f0edfb;stroke:#7461ba;stroke-width:2}.gold{fill:#fff6df;stroke:#b28a2e;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arr)}.line2{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arr2)}.dash{stroke:#916c22;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<rect x="48" y="86" width="390" height="102" rx="14" class="teal"/><text x="78" y="126" class="head">Branch coverage</text><text x="78" y="160" class="small">每个控制流分支是否执行</text>
<rect x="522" y="86" width="390" height="102" rx="14" class="terra"/><text x="552" y="126" class="head">MC/DC</text><text x="552" y="160" class="small">条件独立影响判定结果</text>
<rect x="48" y="238" width="390" height="102" rx="14" class="violet"/><text x="78" y="278" class="head">SQL Logic Test</text><text x="78" y="312" class="small">同一查询跨引擎结果一致性</text>
<rect x="522" y="238" width="390" height="102" rx="14" class="gold"/><text x="552" y="278" class="head">Fuzzing</text><text x="552" y="312" class="small">探索异常输入和崩溃状态</text>
<text x="50" y="420" class="label">TH3 的 100% branch / MC/DC 描述针对其 core-library 覆盖目标，</text><text x="50" y="450" class="small">不是所有扩展、所有构建配置、所有应用场景都 100% 无缺陷。</text></svg>