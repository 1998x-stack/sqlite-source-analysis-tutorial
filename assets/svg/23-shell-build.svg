<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="cli23b-title cli23b-desc"><title id="cli23b-title">CLI 可执行文件的生成路径</title><desc id="cli23b-desc">shell.c 由 src/shell.c.in 生成（make shell.c），再与 SQLite 库源码一起编译成 sqlite3 可执行文件。</desc><defs><marker id="ar23b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="340" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">shell.c 是生成物，不是直接编辑的源文件</text><rect x="26" y="86" width="230" height="90" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="141" y="122" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#147f80">src/shell.c.in</text><text x="141" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#2c5054">CLI 主要代码模板</text><path d="M256 131 L360 131" stroke="#79939b" stroke-width="2.4" fill="none" marker-end="url(#ar23b)"/><text x="308" y="118" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#537178">make shell.c</text><rect x="364" y="86" width="180" height="90" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="454" y="122" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#4b3a6b">shell.c</text><text x="454" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#4b3a6b">生成后的单文件</text><rect x="26" y="210" width="230" height="80" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="1.8"/><text x="141" y="244" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#147f80">sqlite3.c</text><text x="141" y="270" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#2c5054">SQLite 库源码</text><path d="M576 131 C 660 131, 690 240, 760 250" stroke="#79939b" stroke-width="2.2" fill="none" marker-end="url(#ar23b)"/><path d="M256 250 L 610 250" stroke="#79939b" stroke-width="2.2" fill="none" marker-end="url(#ar23b)"/><rect x="620" y="196" width="314" height="108" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="777" y="230" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#8a4326">gcc -o sqlite3 shell.c sqlite3.c …</text><text x="777" y="258" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" fill="#8a4326">→ sqlite3 可执行文件</text><text x="777" y="286" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#8a4326">-ldl -lpthread -lz -lm（依平台而定）</text><text x="26" y="322" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" fill="#537178">官方还建议一组 -DSQLITE_ENABLE_* 选项来构建功能完整的 CLI；选项列表以官方文档为准。</text></svg>
