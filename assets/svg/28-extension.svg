<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="cs28b-title cs28b-desc"><title id="cs28b-title">扩展的加载与注册流程</title><desc id="cs28b-desc">扩展作为共享库被加载后，SQLite 调用入口函数 sqlite3_extension_init，扩展在其中用 sqlite3_create_function 等 API 注册 SQL 函数或虚拟表，随后 SQL 语句即可使用它们。</desc><defs><marker id="ar28b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="380" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">扩展是一段代码 + 一个入口函数</text><rect x="26" y="90" width="200" height="90" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="126" y="124" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#147f80">共享库 / 静态链接</text><text x="126" y="152" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#2c5054">.so / .dll 或编入程序</text><path d="M226 135 L300 135" stroke="#79939b" stroke-width="2.2" fill="none" marker-end="url(#ar28b)"/><rect x="304" y="90" width="250" height="90" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="429" y="120" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#4b3a6b">sqlite3_extension_init()</text><text x="429" y="146" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#4b3a6b">SQLITE_EXTENSION_INIT2(pApi)</text><text x="429" y="168" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#4b3a6b">取得 API 函数指针表</text><path d="M554 135 L628 135" stroke="#79939b" stroke-width="2.2" fill="none" marker-end="url(#ar28b)"/><rect x="632" y="90" width="302" height="90" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="654" y="120" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">sqlite3_create_function() / create_module()</text><text x="654" y="144" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">注册函数、排序规则或虚拟表</text><text x="654" y="166" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">返回 SQLITE_OK 表示加载成功</text><path d="M783 180 L783 232" stroke="#79939b" stroke-width="2.2" fill="none" marker-end="url(#ar28b)"/><rect x="500" y="236" width="434" height="96" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="1.8"/><text x="522" y="266" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" font-weight="700" fill="#3a4f7a">SQL 即可使用注册的能力</text><text x="522" y="292" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#3a4f7a">例如 SELECT myfunc(x) 或 SELECT … FROM myvtab</text><text x="522" y="316" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="12" fill="#537178">运行期加载需显式开启，是安全敏感操作</text><rect x="26" y="236" width="440" height="96" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="1.6"/><text x="48" y="266" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" font-weight="700" fill="#6b5a20">两种部署方式</text><text x="48" y="292" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#6b5a20">静态链接：入口函数需改用不同名字避免重名</text><text x="48" y="316" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#6b5a20">动态加载：用 .load 或 sqlite3_load_extension()</text></svg>
