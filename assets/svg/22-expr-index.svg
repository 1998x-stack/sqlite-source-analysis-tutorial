<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="ei22a-title ei22a-desc"><title id="ei22a-title">表达式索引的键来自表达式计算结果</title><desc id="ei22a-desc">普通索引复制列值作为键；表达式索引对行计算 LOWER(email) 并把结果作为 B-Tree 键，因此 LOWER(email)=? 的查询才能命中索引。</desc><defs><marker id="ar22a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">键不是列值，而是表达式的结果</text><rect x="26" y="74" width="300" height="150" rx="14" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="176" y="104" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#147f80">表 users 的一行</text><text x="48" y="140" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#2c5054">id = 1</text><text x="48" y="166" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#2c5054">email = 'Alice@Example.com'</text><text x="48" y="196" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#537178">普通索引照抄 email 原文</text><path d="M326 150 L470 150" stroke="#79939b" stroke-width="2.4" fill="none" marker-end="url(#ar22a)"/><rect x="474" y="106" width="196" height="88" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="572" y="136" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#4b3a6b">计算 LOWER(email)</text><text x="572" y="166" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" fill="#4b3a6b">→ 'alice@example.com'</text><path d="M670 150 L790 150" stroke="#79939b" stroke-width="2.4" fill="none" marker-end="url(#ar22a)"/><rect x="794" y="106" width="140" height="88" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="864" y="138" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#147f80">B-Tree 键</text><text x="864" y="166" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#2c5054">+ rowid</text><rect x="26" y="256" width="908" height="46" rx="10" fill="#ffefe5" stroke="#bc6b48" stroke-width="1.6"/><text x="42" y="285" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" fill="#8a4326">CREATE INDEX idx_email_lower ON users(LOWER(email));  →  WHERE LOWER(email)='alice@example.com' 可用 SEARCH … USING INDEX</text><text x="26" y="340" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" fill="#537178">被索引的表达式必须是确定性的：同一行、同一输入在任何时候都得到相同结果。</text><text x="26" y="368" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">索引列用普通 column 还是表达式，由索引定义决定，不由查询写法决定。</text></svg>
