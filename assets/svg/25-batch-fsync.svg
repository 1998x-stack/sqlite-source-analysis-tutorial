<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="pf25b-title pf25b-desc"><title id="pf25b-title">逐条提交与批量事务的同步次数对比</title><desc id="pf25b-desc">每条 INSERT 单独提交会对每个事务做一次同步；把多条 INSERT 放进一个事务，只在提交时同步一次，且被写入的数据量相同。</desc><defs><marker id="ar25b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="360" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">同样的写入量，同步次数差很多</text><rect x="26" y="74" width="430" height="180" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="46" y="104" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="16" font-weight="700" fill="#8a4326">每条 INSERT 一个事务</text><rect x="46" y="122" width="90" height="34" rx="7" fill="#fff" stroke="#d9a186" stroke-width="1.2"/><text x="91" y="145" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#8a4326">INSERT</text><rect x="146" y="122" width="90" height="34" rx="7" fill="#fff" stroke="#d9a186" stroke-width="1.2"/><text x="191" y="145" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#8a4326">COMMIT</text><text x="256" y="145" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">→ 一次同步</text><rect x="46" y="166" width="90" height="34" rx="7" fill="#fff" stroke="#d9a186" stroke-width="1.2"/><text x="91" y="189" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#8a4326">INSERT</text><rect x="146" y="166" width="90" height="34" rx="7" fill="#fff" stroke="#d9a186" stroke-width="1.2"/><text x="191" y="189" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#8a4326">COMMIT</text><text x="256" y="189" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#8a4326">→ 又一次同步</text><text x="46" y="228" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#8a4326">… N 行就是 N 次提交 → N 次同步</text><path d="M46 258 L410 258" stroke="#bc6b48" stroke-width="2" fill="none" marker-end="url(#ar25b)"/><text x="228" y="248" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#8a4326">随行数线性增长</text><rect x="504" y="74" width="430" height="180" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="524" y="104" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="16" font-weight="700" fill="#147f80">一个事务包裹 N 条 INSERT</text><rect x="524" y="122" width="120" height="34" rx="7" fill="#fff" stroke="#167c7b" stroke-width="1.2"/><text x="584" y="145" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#147f80">BEGIN</text><rect x="524" y="166" width="270" height="34" rx="7" fill="#fff" stroke="#167c7b" stroke-width="1.2"/><text x="659" y="189" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#147f80">INSERT × N（同一事务内）</text><rect x="684" y="122" width="120" height="34" rx="7" fill="#fff" stroke="#167c7b" stroke-width="1.2"/><text x="744" y="145" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#147f80">COMMIT</text><text x="524" y="228" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#147f80">只有提交时同步一次 → 与行数无关</text><path d="M524 258 L888 258" stroke="#167c7b" stroke-width="2" fill="none" marker-end="url(#ar25b)"/><text x="706" y="248" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#147f80">常数次</text><text x="26" y="302" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">同步次数与持久性/性能直接相关；批量事务减少同步，但也会拉长单次事务的持续时间。</text><text x="26" y="330" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#537178">图中为机制示意，未测量具体 fsync 次数或耗时；实际取决于平台、文件系统与 synchronous 设置。</text></svg>
