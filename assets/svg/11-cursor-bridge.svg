<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v11c-title v11c-desc" viewBox="0 0 960 396" width="960" height="396"><title id="v11c-title">VDBE 游标与 B-Tree 和 Pager 关系</title><desc id="v11c-desc">虚拟机游标与 Btree cursor 不等于数据库文件指针，读行通过 Btree 接口、Pager、PCache，缓存未命中时才经 VFS。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="396" fill="#fbfcfa"/><text x="28" y="40" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">从一条 Seek 指令到一条数据库记录</text><rect x="26" y="106" width="209" height="96" rx="12" fill="#eee9f9" stroke="#705fb5" stroke-width="1.6"/><text x="130.5" y="136" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">VDBE Op / Cursor</text><text x="130.5" y="164" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">OpenRead → Seek → Column</text><rect x="284" y="106" width="194" height="96" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="381" y="136" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">BtreeCursor</text><text x="381" y="164" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">定位 table / index key</text><rect x="531" y="106" width="194" height="96" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="628" y="136" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Pager / PCache</text><text x="628" y="164" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">获取页与缓存命中</text><rect x="778" y="106" width="155" height="96" rx="12" fill="#ffede4" stroke="#be6749" stroke-width="1.6"/><text x="855.5" y="136" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">VFS</text><text x="855.5" y="164" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">需要时读文件</text><path d="M235 152L280 152" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M478 152L528 152" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M725 152L774 152" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" stroke-dasharray="6 5"/><rect x="72" y="268" width="320" height="34" rx="17" fill="#eee9f9"/><text x="232" y="291" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2d5659" font-weight="750" text-anchor="middle">游标位置：当前 B-Tree 键</text><rect x="557" y="268" width="323" height="34" rx="17" fill="#e2f3ed"/><text x="718.5" y="291" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2d5659" font-weight="750" text-anchor="middle">PCache 命中时无需新的 xRead</text><text x="30" y="366" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#58737a" font-weight="470" text-anchor="start">注意：不是每次 Column 都触发文件读；VDBE opcode 的参数含义要查同版本 opcode 文档。</text></svg>
