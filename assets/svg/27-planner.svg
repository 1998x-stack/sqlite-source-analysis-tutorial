<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="fe27b-title fe27b-desc"><title id="fe27b-title">复合 SELECT 改用排序合并</title><desc id="fe27b-desc">3.53.0 起 EXCEPT、INTERSECT、UNION 统一采用 sort-and-merge，而不是哈希表，因为前者在多数情况下更快。</desc><defs><marker id="ar27b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="360" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">EXCEPT / INTERSECT / UNION 的执行策略变更</text><rect x="26" y="80" width="240" height="90" rx="10" fill="#e8f3ef" stroke="#167c7b" stroke-width="1.8"/><text x="146" y="112" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#147f80">左子查询</text><text x="146" y="140" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#2c5054">按需要排序</text><rect x="26" y="196" width="240" height="90" rx="10" fill="#e8f3ef" stroke="#167c7b" stroke-width="1.8"/><text x="146" y="228" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#147f80">右子查询</text><text x="146" y="256" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#2c5054">按相同顺序排序</text><path d="M266 125 L400 175" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar27b)"/><path d="M266 241 L400 191" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar27b)"/><rect x="404" y="106" width="230" height="154" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="519" y="140" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#8a4326">排序合并（sort-and-merge）</text><text x="519" y="170" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#8a4326">两条有序流线性比较前进</text><text x="519" y="196" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="13" fill="#8a4326">顺序输出去重后的结果</text><text x="519" y="228" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="12" fill="#537178">3.53.0 起对三种集合操作统一采用</text><path d="M634 183 L720 183" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar27b)"/><rect x="724" y="100" width="210" height="166" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="1.8"/><text x="829" y="132" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#4b3a6b">为什么改</text><text x="744" y="164" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#4b3a6b">官方说明：排序合并</text><text x="744" y="188" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#4b3a6b">“几乎总是比哈希表更快”</text><text x="744" y="214" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#4b3a6b">哈希表可能占用更多内存、</text><text x="744" y="238" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="13" fill="#4b3a6b">且难与已有顺序复用</text><text x="26" y="326" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">图中为机制示意；具体计划仍由查询规划器根据数据与索引决定，不应写成固定 plan 文本。</text></svg>
