<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v14c-title v14c-desc" viewBox="0 0 960 438" width="960" height="438"><title id="v14c-title">VFS shim 委托底层实现的结构</title><desc id="v14c-desc">自定义 VFS shim 可以记录 open/read/write/sync 操作并转发到父 VFS；必须遵守 sqlite3_file 内存布局、方法表和线程安全、锁与错误码约定。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="438" fill="#fbfcfa"/><text x="28" y="40" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#25474a" font-weight="750" text-anchor="start">观察型 shim 应先记录，再委托，不要随意改变同步语义</text><rect x="32" y="102" width="262" height="95" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="163" y="132" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">SQLite Pager</text><text x="163" y="160" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">调用 VFS methods</text><rect x="348" y="102" width="262" height="95" rx="12" fill="#fff4dc" stroke="#9b772e" stroke-width="1.6"/><text x="479" y="132" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Logging shim</text><text x="479" y="160" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">记录参数 / rc</text><rect x="665" y="102" width="262" height="95" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="796" y="132" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">Default VFS</text><text x="796" y="160" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">Unix / Win32 文件方法</text><path d="M294 149L345 149" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M610 149L662 149" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><rect x="89" y="285" width="359" height="82" rx="12" fill="#eee9f9" stroke="#705fb5" stroke-width="1.6"/><text x="268.5" y="315" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">记录 xRead / xWrite / xSync</text><text x="268.5" y="343" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">收集顺序与失败情况</text><rect x="523" y="285" width="359" height="82" rx="12" fill="#ffede4" stroke="#be6749" stroke-width="1.6"/><text x="702.5" y="315" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">回传原始 rc 与语义</text><text x="702.5" y="343" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">不能忽略 fsync / 锁</text><path d="M480 200L260 283" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M790 200L702 283" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><text x="27" y="407" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#567277" font-weight="470" text-anchor="start">实践从 sqlite3_vfs_find() 和 sqlite3_open_v2() 选择真实 VFS 开始，再进阶包装。</text></svg>
