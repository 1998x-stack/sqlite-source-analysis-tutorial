<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="fts21b-title fts21b-desc"><title id="fts21b-title">FTS3/FTS4 的 segment 分层合并</title><desc id="fts21b-desc">新文档先写成小 b-tree segment，后台按层级把多个 segment 合并为更大的 segment；optimize 命令可把全部 segment 合并成一个。</desc><defs><marker id="ar21b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="380" fill="#fbfcfa"/><text x="26" y="38" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">新文档不是立即重建整棵索引</text><text x="26" y="72" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">level 0（小 segment，写一次就产生一个）</text><rect x="26" y="84" width="120" height="46" rx="8" fill="#e8f3ef" stroke="#167c7b" stroke-width="1.6"/><text x="86" y="112" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" fill="#24464b">seg A</text><rect x="162" y="84" width="120" height="46" rx="8" fill="#e8f3ef" stroke="#167c7b" stroke-width="1.6"/><text x="222" y="112" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" fill="#24464b">seg B</text><rect x="298" y="84" width="120" height="46" rx="8" fill="#e8f3ef" stroke="#167c7b" stroke-width="1.6"/><text x="358" y="112" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" fill="#24464b">seg C</text><rect x="434" y="84" width="120" height="46" rx="8" fill="#e8f3ef" stroke="#167c7b" stroke-width="1.6"/><text x="494" y="112" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" fill="#24464b">seg D</text><text x="600" y="112" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">查询要同时读多个 segment</text><path d="M86 130 L298 172" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar21b)"/><path d="M222 130 L360 172" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar21b)"/><path d="M358 130 L420 172" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar21b)"/><path d="M494 130 L482 172" stroke="#79939b" stroke-width="2" fill="none" marker-end="url(#ar21b)"/><text x="26" y="166" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">level 1（多个小 segment 合并）</text><rect x="298" y="176" width="224" height="46" rx="8" fill="#f4edf9" stroke="#8662a9" stroke-width="1.8"/><text x="410" y="204" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#4b3a6b">合并后的 seg (A…D)</text><path d="M410 222 L410 258" stroke="#79939b" stroke-width="2.4" fill="none" marker-end="url(#ar21b)"/><text x="26" y="252" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">optimize 命令</text><rect x="298" y="262" width="300" height="46" rx="8" fill="#ffefe5" stroke="#bc6b48" stroke-width="1.8"/><text x="448" y="290" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#8a4326">合并为单个大 segment</text><text x="640" y="290" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="14" fill="#537178">查询更快，但合并本身有成本</text><text x="26" y="348" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" fill="#537178">层级数与触发阈值由 merge=X,Y、automerge=N 等命令和默认策略决定，不写死为固定层数。</text></svg>
