<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="plan18a-title plan18a-desc"><title id="plan18a-title">SQLite 查询规划从条件项到候选访问路径和 VDBE</title><desc id="plan18a-desc">WHERE 条件被分析为约束候选，索引/表扫描形成 WhereLoop 候选，路径搜索评估组合，再由代码生成变成 VDBE；不是简单遍历全部 N! 顺序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="430" fill="#fbfcfa"/><text x="26" y="40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="20" font-weight="700" fill="#24464b">优化器搜索的是候选路径，不只是决定“是否用索引”</text><rect x="27" y="105" width="208" height="94" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="131" y="134" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">WHERE terms</text><text x="131" y="161" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">等值 / 范围 / JOIN</text><rect x="268" y="105" width="208" height="94" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="372" y="134" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">WhereLoop</text><text x="372" y="161" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">扫描表 / 索引候选</text><rect x="509" y="105" width="208" height="94" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="613" y="134" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Path search</text><text x="613" y="161" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">成本与前缀状态</text><rect x="750" y="105" width="183" height="94" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="841.5" y="134" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">VDBE code</text><text x="841.5" y="161" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">循环与游标</text><path d="M235 151 L265 151" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M476 151 L506 151" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M717 151 L746 151" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect x="54" y="280" width="385" height="35" rx="16" fill="#f8f3e4" stroke="#9b833c" stroke-width=".8"/><text x="246.5" y="304" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5054">ANALYZE 更新统计估计（sqlite_stat1）</text><rect x="525" y="280" width="386" height="35" rx="16" fill="#e8f3ef" stroke="#167c7b" stroke-width=".8"/><text x="718" y="304" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5054">目标：低估计成本，不是绝对最优</text><text x="27" y="402" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#587177">真实候选和代价受版本、统计信息、索引和连接限制；不保证返回全球最优计划。</text></svg>
