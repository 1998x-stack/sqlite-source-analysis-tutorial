<svg xmlns="http://www.w3.org/2000/svg" width="960" height="429" viewBox="0 0 960 429" role="img" aria-labelledby="func19b-title func19b-desc"><title id="func19b-title">聚合回调 xStep xFinal 和窗口 xInverse xValue 的区别</title><desc id="func19b-desc">聚合对每行调用 xStep 保存 accumulator，组结束调用 xFinal；窗口函数可有 xStep、xInverse、xValue 和 xFinal，不是简单每个组只运行一次。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="429" fill="#fbfcfa"/><text x="25" y="41" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">SUM 类聚合与移动窗口：是否能撤销旧行？</text><rect x="28" y="101" width="268" height="101" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="162" y="130" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">xStep(row 1..N)</text><text x="162" y="157" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">累加 sqlite3_aggregate_context</text><rect x="352" y="101" width="268" height="101" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="486" y="130" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">xFinal</text><text x="486" y="157" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">输出组最终值</text><rect x="678" y="101" width="252" height="101" rx="12" fill="#f4edf9" stroke="#8662a9" stroke-width="2"/><text x="804" y="130" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Window API</text><text x="804" y="157" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">xInverse + xValue</text><path d="M296 151 L349 151" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M620 151 L675 151" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect x="156" y="283" width="284" height="78" rx="12" fill="#f8f3e4" stroke="#9b833c" stroke-width="2"/><text x="298" y="312" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">GROUP BY → 每组累加</text><text x="298" y="339" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">通常结束时归并结果</text><rect x="545" y="283" width="284" height="78" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="687" y="312" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">滑动帧 → 排出旧行</text><text x="687" y="339" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">与具体窗口定义有关</text><text x="29" y="402" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#55747b">聚合状态必须按 SQLite 生命周期管理，不要用共享全局变量当作每组累加器。</text></svg>
