<svg xmlns="http://www.w3.org/2000/svg" width="960" height="411" viewBox="0 0 960 411" role="img" aria-labelledby="wal16b-title wal16b-desc"><title id="wal16b-title">WAL 读者 end mark 对页面版本可见性的影响</title><desc id="wal16b-desc">读者 R1 建立快照时 end mark=2；后续 writer 添加新的帧 3 和 4；R1 仍看旧版本，新的 R2 能看最新提交。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79939b"/></marker></defs><rect x="0" y="0" width="960" height="411" fill="#fbfcfa"/><text x="26" y="39" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="21" font-weight="700" fill="#24464b">写者追加帧，旧读者不跟着移动快照</text><rect x="34" y="94" width="202" height="90" rx="12" fill="#ecf0f8" stroke="#647ab1" stroke-width="2"/><text x="135" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Frame 1</text><text x="135" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">p=5 · old</text><rect x="254" y="94" width="202" height="90" rx="12" fill="#e8f3ef" stroke="#167c7b" stroke-width="2"/><text x="355" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Frame 2</text><text x="355" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">commit A</text><rect x="474" y="94" width="202" height="90" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="575" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Frame 3</text><text x="575" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">p=5 · new</text><rect x="694" y="94" width="202" height="90" rx="12" fill="#ffefe5" stroke="#bc6b48" stroke-width="2"/><text x="795" y="123" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#24464b">Frame 4</text><text x="795" y="150" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="440" fill="#4d6d71">commit B</text><path d="M344 189 L344 262" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><path d="M784 189 L784 262" stroke="#79939b" stroke-width="2.4"  fill="none" marker-end="url(#arrow)"/><rect x="183" y="272" width="323" height="35" rx="16" fill="#ecf0f8" stroke="#647ab1" stroke-width=".8"/><text x="344.5" y="296" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5054">R1 end mark = 2 · 旧视图</text><rect x="611" y="272" width="316" height="35" rx="16" fill="#e8f3ef" stroke="#167c7b" stroke-width=".8"/><text x="769" y="296" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#2c5054">R2 end mark = 4 · 新视图</text><text x="26" y="374" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="start" font-size="15" font-weight="440" fill="#557176">end mark 锁定可见 frame 范围，不代表应用拿到一份物理复制的数据库文件。</text></svg>
