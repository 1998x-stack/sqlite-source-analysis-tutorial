<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">SQLite 动态扩展加载生命周期</title><desc id="svg-desc">应用在可信边界内启用 C 扩展加载接口，加载共享库并调用入口函数，入口注册 SQL 函数。</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#147f80"/></marker>
 <marker id="arrow-rust" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c76743"/></marker>
 <style>
 .bg{fill:#fffdf9}.teal{fill:#dff1eb;stroke:#147f80;stroke-width:2}.rust{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#eeeafd;stroke:#7161b5;stroke-width:2}.gold{fill:#fbf1d9;stroke:#a77b28;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arrow)}.line-r{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arrow-rust)}.dash{stroke:#8c9c98;stroke-width:2;stroke-dasharray:7 7;fill:none}.head{font:700 29px system-ui,sans-serif;fill:#153438}.label{font:700 21px system-ui,sans-serif;fill:#203035}.small{font:17px system-ui,sans-serif;fill:#53676d}.tiny{font:15px system-ui,sans-serif;fill:#53676d}
 </style>
</defs>
<rect class="bg" width="1000" height="560" rx="22"/>
<text x="48" y="52" class="head">SQLite 动态扩展加载生命周期</text>
<rect x="55" y="135" width="190" height="115" rx="14" class="teal"/><text x="150" y="175" text-anchor="middle" class="label">应用</text><text x="150" y="210" text-anchor="middle" class="small">打开 sqlite3*</text><path d="M245 192 H290" class="line"/><rect x="290" y="135" width="190" height="115" rx="14" class="gold"/><text x="385" y="175" text-anchor="middle" class="label">受控启用</text><text x="385" y="210" text-anchor="middle" class="small">DBCONFIG C API only</text><path d="M480 192 H525" class="line"/><rect x="525" y="135" width="190" height="115" rx="14" class="violet"/><text x="620" y="175" text-anchor="middle" class="label">共享库</text><text x="620" y="210" text-anchor="middle" class="small">sqlite3_course_init</text><path d="M715 192 H760" class="line"/><rect x="760" y="135" width="190" height="115" rx="14" class="rust"/><text x="855" y="175" text-anchor="middle" class="label">注册 API</text><text x="855" y="210" text-anchor="middle" class="small">create_function_v2</text><path d="M855 250 V330 H620" class="line"/><rect x="480" y="330" width="280" height="100" rx="14" class="teal"/><text x="620" y="370" text-anchor="middle" class="label">SQL 执行</text><text x="620" y="403" text-anchor="middle" class="small">SELECT course_build()</text><path d="M480 380 H245 V260" class="dash"/><rect x="55" y="330" width="190" height="100" rx="14" class="gold"/><text x="150" y="370" text-anchor="middle" class="label">信任边界</text><text x="150" y="403" text-anchor="middle" class="small">路径白名单 / 签名</text><text x="50" y="500" class="small">若无需动态分发，静态链接可减少运行时加载面；不要随意开启 SQL load_extension()。</text>
</svg>