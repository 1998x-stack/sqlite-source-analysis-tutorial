<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">浏览器存储 VFS 的能力矩阵</title><desc id="svg-desc">对比内存、kvvfs、OPFS、OPFS Web Locks 和 SAH pool 的线程位置、持久化、并发与响应头要求。</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#147f80"/></marker>
 <marker id="arrow-rust" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c76743"/></marker>
 <style>
 .bg{fill:#fffdf9}.teal{fill:#dff1eb;stroke:#147f80;stroke-width:2}.rust{fill:#fff0e8;stroke:#c76743;stroke-width:2}.violet{fill:#eeeafd;stroke:#7161b5;stroke-width:2}.gold{fill:#fbf1d9;stroke:#a77b28;stroke-width:2}.line{stroke:#147f80;stroke-width:3;fill:none;marker-end:url(#arrow)}.line-r{stroke:#c76743;stroke-width:3;fill:none;marker-end:url(#arrow-rust)}.dash{stroke:#8c9c98;stroke-width:2;stroke-dasharray:7 7;fill:none}.head{font:700 29px system-ui,sans-serif;fill:#153438}.label{font:700 21px system-ui,sans-serif;fill:#203035}.small{font:17px system-ui,sans-serif;fill:#53676d}.tiny{font:15px system-ui,sans-serif;fill:#53676d}
 </style>
</defs>
<rect class="bg" width="1000" height="560" rx="22"/>
<text x="48" y="52" class="head">浏览器存储 VFS 的能力矩阵</text>
<text x="50" y="100" class="small">后端</text><text x="350" y="100" class="small">线程位置</text><text x="515" y="100" class="small">持久化</text><text x="665" y="100" class="small">并发 / 锁</text><text x="860" y="100" class="small">COOP/COEP</text><path d="M48 115 H950" class="dash"/>
<rect x="48" y="145" width="904" height="58" rx="10" class="gold"/><text x="70" y="182" class="label">memory</text><text x="350" y="181" class="small">主线程 / Worker</text><text x="535" y="181" class="small">否</text><text x="665" y="181" class="small">实例内独立</text><text x="885" y="181" text-anchor="middle" class="small">否</text><rect x="48" y="217" width="904" height="58" rx="10" class="gold"/><text x="70" y="254" class="label">kvvfs</text><text x="350" y="253" class="small">主线程</text><text x="535" y="253" class="small">是</text><text x="665" y="253" class="small">单 storage 单库</text><text x="885" y="253" text-anchor="middle" class="small">否</text><rect x="48" y="289" width="904" height="58" rx="10" class="teal"/><text x="70" y="326" class="label">opfs</text><text x="350" y="325" class="small">Worker</text><text x="535" y="325" class="small">是</text><text x="665" y="325" class="small">文件锁 / SQLITE_BUSY</text><text x="885" y="325" text-anchor="middle" class="small">是</text><rect x="48" y="361" width="904" height="58" rx="10" class="violet"/><text x="70" y="398" class="label">opfs-wl</text><text x="350" y="397" class="small">Worker</text><text x="535" y="397" class="small">是</text><text x="665" y="397" class="small">Web Locks / FIFO</text><text x="885" y="397" text-anchor="middle" class="small">是</text><rect x="48" y="433" width="904" height="58" rx="10" class="rust"/><text x="70" y="470" class="label">opfs-sahpool</text><text x="350" y="469" class="small">Worker</text><text x="535" y="469" class="small">是</text><text x="665" y="469" class="small">需应用层协作</text><text x="885" y="469" text-anchor="middle" class="small">否</text>
<text x="50" y="535" class="tiny">WASMFS + OPFS：另行构建的可选变体；不要与 canonical 默认 sqlite3.wasm 混为一谈。</text>
</svg>