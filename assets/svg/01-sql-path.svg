c</text><rect x="608" y="88" width="146" height="86" rx="14" fill="#ece9f7" stroke="#7763b5" stroke-width="1.6"/><text x="681" y="119" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">VDBE 执行</text><text x="681" y="146" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">vdbe.c</text><rect x="802" y="88" width="146" height="86" rx="14" fill="#fff4d9" stroke="#ab7b25" stroke-width="1.6"/><text x="875" y="119" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">结果行</text><text x="875" y="146" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">sqlite3_step()</text><path d="M172 130L216 130" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M366 130L410 130" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M560 130L604 130" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M754 130L798 130" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M681 174L681 220" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="570" y="229" width="221" height="78" rx="14" fill="#e3f2ec" stroke="#18847d" stroke-width="1.6"/><text x="680.5" y="260" text-anchor="middle" fill="#243f43" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">B-Tree / Pager</text><text x="680.5" y="287" text-anchor="middle" fill="#527075" font-size="14" font-weight="450" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">btree.c · pager.c</text><path d="M570 266L476 266" fill="none" stroke="#789395" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="268" y="229"