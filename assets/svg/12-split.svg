<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v12c-title v12c-desc" viewBox="0 0 960 440" width="960" height="440"><title id="v12c-title">B-Tree 页面溢出与平衡示意</title><desc id="v12c-desc">示意页面插入后空间不足时，平衡操作会重分配单元并可能创建兄弟页/调整父节点；真实 SQLite 不保证一次插入总触发一个精确二分的 split。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#769598"/></marker></defs><rect width="960" height="440" fill="#fbfcfa"/><text x="27" y="40" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#25474a" font-weight="750" text-anchor="start">单页空间不够 ≠ 简单对半复制一页</text><rect x="32" y="97" width="240" height="115" rx="12" fill="#e2f3ed" stroke="#177b77" stroke-width="1.6"/><text x="152" y="127" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">当前叶页</text><text x="152" y="155" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">[10 20 30 40] + new 25</text><rect x="363" y="97" width="238" height="115" rx="12" fill="#fff4dc" stroke="#9b772e" stroke-width="1.6"/><text x="482" y="127" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">平衡操作</text><text x="482" y="155" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">利用相邻页与父页</text><rect x="692" y="97" width="237" height="115" rx="12" fill="#eee9f9" stroke="#705fb5" stroke-width="1.6"/><text x="810.5" y="127" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">更新页面布局</text><text x="810.5" y="155" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">索引 / rowid 顺序保持</text><path d="M272 154L360 154" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M601 154L688 154" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><rect x="99" y="281" width="307" height="83" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="252.5" y="311" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">左侧候选页</text><text x="252.5" y="339" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">10, 20, 25</text><rect x="557" y="281" width="307" height="83" rx="12" fill="#e8f1f4" stroke="#497387" stroke-width="1.6"/><text x="710.5" y="311" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#25474a" font-weight="750" text-anchor="middle">右侧候选页</text><text x="710.5" y="339" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#566d71" font-weight="470" text-anchor="middle">30, 40</text><path d="M782 215L714 277" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><path d="M780 215L246 277" fill="none" stroke="#769598" stroke-width="2.3" marker-end="url(#a)" /><text x="28" y="407" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#537177" font-weight="470" text-anchor="start">以上键值是示意。SQLite 的 balance 选择与相邻页、cell 大小和页满程度相关。</text></svg>
