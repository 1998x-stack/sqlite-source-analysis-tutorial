name: Site quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify chapters, source links, and SVGs
        run: python scripts/check_site.py
      - name: Test SQL and C examples
        run: |
          python scripts/test_examples.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev sqlite3
          cc -std=c11 -Wall -Wextra -Werror -O2 examples/05_lookaside_status.c -lsqlite3 -o /tmp/sqlite-lookaside-status
          /tmp/sqlite-lookaside-status
          python examples/09_toy_reduce.py
          for name in 06_error_codes 07_trace_events 08_token_boundary 10_expr_prepared; do
            cc -std=c11 -Wall -Wextra -Werror -O2 "examples/${name}.c" -lsqlite3 -o "/tmp/sqlite-${name}"
            "/tmp/sqlite-${name}"
          done
      - name: Verify SQLite file format and transaction experiments
        run: |
          python examples/12_file_inspect.py
          python examples/15_transactions.py
          cc -std=c11 -Wall -Wextra -Werror -O2 examples/11_vdbe_steps.c -lsqlite3 -o /tmp/sqlite-11-vdbe
          /tmp/sqlite-11-vdbe
          cc -std=c11 -Wall -Wextra -Werror -O2 examples/13_cache_stats.c -lsqlite3 -o /tmp/sqlite-13-cache
          /tmp/sqlite-13-cache
          cc -std=c11 -Wall -Wextra -Werror -O2 examples/14_vfs_select.c -lsqlite3 -o /tmp/sqlite-14-vfs
          /tmp/sqlite-14-vfs /tmp/sqlite-14-vfs-demo.sqlite
      - name: Verify WAL, concurrency, planner and extension experiments
        run: |
          python examples/16_wal_snapshot.py
          python examples/16_wal_inspect.py
          python examples/17_lock_matrix.py
          python examples/18_plan_experiment.py
          for name in 19_functions 20_vtab_rows; do
            cc -std=c11 -Wall -Wextra -Werror -O2 "examples/${name}.c" -lsqlite3 -o "/tmp/sqlite-${name}"
            "/tmp/sqlite-${name}"
          done
      - name: Verify FTS5, CLI, regression and performance examples
        run: |
          python examples/21_tokenizer_probe.py
          python examples/24_test_contracts.py
          python examples/25_benchmark.py
          sqlite3 :memory: < examples/23_cli_workflow.sql > /tmp/sqlite-cli-output.txt
          grep -q "Ada" /tmp/sqlite-cli-output.txt
          grep -q "Mira" /tmp/sqlite-cli-output.txt
          cc -std=c11 -Wall -Wextra -Werror -O2 examples/25_stmt_status.c -lsqlite3 -o /tmp/sqlite-25-status
          /tmp/sqlite-25-status
      - name: Install Chromium for visual smoke tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify responsive reading and native interactions
        run: python scripts/browser_smoke.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-site-qa
          path: qa-local/
          if-no-files-found: ignore
