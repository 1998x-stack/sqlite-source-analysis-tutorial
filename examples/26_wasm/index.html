<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>SQLite WASM Worker 实验</title>
  <style>
    :root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#203035;background:#f6f3ed}
    body{max-width:860px;margin:48px auto;padding:0 20px;line-height:1.75}
    main{background:#fffdf9;border:1px solid #dbe3de;border-radius:18px;padding:28px}
    button{border:0;border-radius:999px;background:#147f80;color:white;font:inherit;font-weight:700;padding:10px 18px;cursor:pointer}
    button:focus-visible{outline:3px solid #c76743;outline-offset:3px}
    pre{overflow:auto;background:#16292d;color:#e7f4ef;padding:16px;border-radius:12px;min-height:100px}
    .muted{color:#53676d}
  </style>
</head>
<body>
<main>
  <p class="muted">SQLite 3.54.1 · Web Worker · OPFS when available</p>
  <h1>在 Worker 中运行 SQLite</h1>
  <p>主线程只发送任务并接收结果。Worker 在初始化后检测官方 OPFS VFS；不可用时退回独立内存数据库。</p>
  <button id="run" type="button">运行一次 SQL 实验</button>
  <p id="status" role="status" aria-live="polite">等待运行</p>
  <pre id="output">尚无结果</pre>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
